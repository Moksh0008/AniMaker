<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Animaker</title>
    <link rel="stylesheet" href="1styles.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
        /* Extra CSS for logo alignment */
        .logo {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .logo img {
            height: 40px; /* adjust based on your logo */
            margin-right: 10px; /* spacing between logo and text */
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="logo.png" alt="AniMaker Logo">
            Animaker
        </div>
        <ul class="nav-links">
            <li><a href="1index.html">Home</a></li>
            <li><a href="2login.html">Login</a></li>
            <li><a href="3signup.html" class="active">Sign Up</a></li>
        </ul>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <input type="text" id="signup-name" placeholder="Full Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signup-email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="auth-button">Sign Up</button>
                <p class="auth-link">Already have an account? <a href="2login.html">Login</a></p>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Animaker. All rights reserved.</p>
    </footer>

    <script src="3auth.js"></script>
</body>
</html>




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page with Back Button</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Back Button */
    .back-button {
      position: fixed;
      top: 80px;   /* 👈 moved down from 20px to 80px */
      left: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(145deg, #6a1bbd, #8a2be2);
      color: #fff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .back-button:hover {
      background: linear-gradient(145deg, #8a2be2, #6a1bbd);
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <!-- Back Button -->
  <button class="back-button" onclick="goBack()">
    <i class="fas fa-arrow-left"></i>
  </button>

  <script>
    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
