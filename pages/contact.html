<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>

  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link" data-tooltip="Creator"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link" data-tooltip="Maker"><i class="fas fa-cube"></i><span>Maker</span></a>

      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-container">
        <div class="page-header">
          <h1>Contact Us</h1>
          <p>Have a question or want to collaborate? We'd love to hear from you.</p>
        </div>

        <div class="contact-grid">
          <div class="contact-info-card">
            <h3>Get in Touch</h3>
            <div class="contact-info-item">
              <i class="fas fa-envelope"></i>
              <div class="info-text">
                <strong>Email</strong>
                animaker@gmail.com
              </div>
            </div>
            <div class="contact-info-item">
              <i class="fas fa-phone"></i>
              <div class="info-text">
                <strong>Phone</strong>
                Available on request
              </div>
            </div>
            <div class="contact-info-item">
              <i class="fab fa-instagram"></i>
              <div class="info-text">
                <strong>Instagram</strong>
                <a href="https://www.instagram.com/ani_maker08/" target="_blank" style="color:var(--accent);">@ani_maker08</a>
              </div>
            </div>
          </div>

          <div class="contact-form-card">
            <h3>Send a Message</h3>
            <form id="contactForm">
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Your name" required>
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
              </div>
              <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="Your phone number">
              </div>
              <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" class="form-input" placeholder="How can we help?" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">
                <i class="fas fa-paper-plane"></i> Send Message
              </button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script>updateNavbarAuth();</script>
</body>
</html>
