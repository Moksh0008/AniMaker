<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact AniMaker</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ==== All your styles remain unchanged ==== */
    
    /* Reset & Body */
    * {margin:0; padding:0; box-sizing:border-box;}
    body {
      font-family: 'Montserrat', sans-serif;
      line-height:1.6;
      overflow-x:hidden;
      background: linear-gradient(135deg, #2b003d, #4b0082, #6a00b3);
      background-attachment: fixed;
      color:#e0d0ff;
      position: relative;
    }

    /* Background Watermark */
    body::before {
      content:"";
      position:fixed;
      top:0; left:0; right:0; bottom:0;
      background: url('../assets/images/contact-bg.jpg') no-repeat center center;
      background-size: cover;
      opacity: 0.5;
      z-index: -1;
    }

    /* Floating magical orbs */
    body::after {
      content:"";
      position:absolute;
      border-radius:50%;
      filter: blur(180px);
      animation: floatOrb 15s infinite alternate;
      width:600px; height:600px; background:rgba(255,255,255,0.08);
      bottom:-200px; right:-250px;
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) translateX(0);}
      50% { transform: translateY(-50px) translateX(40px);}
      100% { transform: translateY(0) translateX(0);}
    }

    .main-container {
      text-align: left;
      max-width: 700px;
      margin: 50px;
    }

    .contact-header {
      padding: 80px 20px 40px;
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s ease-out;
    }

    .contact-header.visible {
      opacity: 1;
      transform: translateY(0);
    }

   .contact-header h1 {
    font-size: 3rem;

    background: linear-gradient(
        45deg,
        #ffffff,
        #cfcfcf,
        #b399ff
    );

    background-size: 200% 200%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation: gradientText 5s ease infinite alternate;

    text-shadow: 0 0 10px #b399ff;
}

@keyframes gradientText {
    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 100% 50%;
    }
}

    @keyframes gradientText {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .about-section {
      padding:40px 20px;
      opacity:0; transform: translateY(50px);
      transition: all 0.8s ease-out;
      background: rgba(255,255,255,0.06); border-radius:25px;
      margin:20px 0; backdrop-filter: blur(15px);
    }

    .about-section.visible {
      opacity:1; transform: translateY(0);
    }

    .about-section h3 {
      font-size:2rem; margin-bottom:25px; color:#ffccff; text-shadow:0 0 10px #8a2be2;
    }

    .contact-info p {
      margin:10px 0; font-size:1.1rem;
    }

    .contact-info a {
      color:#b399ff; transition:0.3s;
    }

    .contact-info a:hover {
      color:#fff; text-shadow:0 0 8px #ff6ec4;
    }

    .form-section {
      margin:30px 0; padding:40px 20px;
      background: rgba(255,255,255,0.1); border-radius:25px; backdrop-filter: blur(15px);
      opacity:0; transform: translateY(50px); transition: all 0.8s ease-out;
    }

    .form-section.visible {
      opacity:1; transform: translateY(0);
    }

    .form-section h2 {
      margin-bottom:30px; color:#ffccff; text-shadow:0 0 8px #8a2be2;
    }

    form label {
      display:block; margin:15px 0 5px; font-weight:bold;
    }

    form input, form textarea {
      width:100%; padding:12px; border-radius:12px; border:none; margin-bottom:15px;
      outline:none; background: rgba(255,255,255,0.05); color:#fff; backdrop-filter: blur(5px);
    }

    form button {
      background: linear-gradient(145deg,#8a2be2,#b399ff);
      color:white; padding:12px 25px; border:none; border-radius:30px;
      cursor:pointer; font-weight:bold; margin-top:10px; box-shadow:0 6px 15px rgba(138,43,226,0.5);
      transition: all 0.3s ease;
    }

    form button:hover {
      transform: translateY(-3px) scale(1.05); box-shadow:0 10px 25px rgba(138,43,226,0.7);
    }

    /* Back Button */
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(145deg, #6a1bbd, #8a2be2);
      color: #fff;
      border: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 6px 6px 12px rgba(0,0,0,0.3),
                  -3px -3px 7px rgba(255,255,255,0.1);
      transition: transform 0.25s ease, background 0.3s ease, box-shadow 0.3s ease;
      z-index: 1200;
    }

    .back-button:hover { 
      background: linear-gradient(145deg, #ff6ec4, #8a2be2); 
      transform: translateY(-4px) scale(1.15) rotate(-8deg); 
      box-shadow: 0px 12px 25px rgba(0,0,0,0.6),
                  0px 0px 25px rgba(255,105,180,0.8);
    }
  </style>
</head>
<body>

  <!-- Back Button -->
  <button id="backButton" class="back-button">
    <i class="fas fa-arrow-left"></i>
  </button>

  <div class="main-container">
    <!-- Contact Header -->
    <header class="contact-header">
      <h1>Contact AniMaker</h1>
    </header>

    <!-- About Section -->
    <section class="about-section">
      <h3>Animate Out Of The Box</h3>
      <div class="contact-info">
        <p><strong>Email:</strong> animaker@gamil.com</p>
        <p><strong>Phone:</strong> 8*********</p>
        <p><strong>Instagram:</strong> <a href="https://www.instagram.com/ani_maker08/" target="_blank">AniMaker@instagram</a></p>
      </div>
    </section>

    <!-- Form Section -->
    <section class="form-section">
      <h2>Send Us a Message</h2>
      <form id="contactForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Your message"></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </div>

  <!-- Intersection Observer Animation -->
  <script>
    const sections = document.querySelectorAll('.contact-header, .about-section, .form-section');
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.2 });
    sections.forEach(section => observer.observe(section));
  </script>

  <!-- Back Button Script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('backButton').addEventListener('click', function() {
        window.location.href = '../index.html'; // ✅ Change this if needed
      });
    });
  </script>
</body>
</html>
