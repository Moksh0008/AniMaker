<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    /* Profile page styles */
    .profile-page { padding: 0 0 60px; }

    .profile-header {
      max-width: 935px;
      margin: 0 auto;
      padding: 32px 24px 0;
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .profile-avatar-wrap {
      flex-shrink: 0;
      position: relative;
    }

    .profile-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg-tertiary);
      border: 3px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar .avatar-initial {
      font-size: 56px;
      font-weight: 700;
      color: #fff;
      background: var(--accent);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-upload-btn {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: 3px solid var(--bg-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease;
      z-index: 2;
    }

    .avatar-upload-btn:hover { transform: scale(1.1); }

    .profile-info { flex: 1; min-width: 0; }

    .profile-top-row {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .profile-username {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
    }

    .profile-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .profile-actions .btn { font-size: 13px; padding: 8px 20px; }

    /* Instagram-style create button */
    .create-new-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      margin-left: 16px;
    }

    .create-new-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .create-new-circle:hover {
      border-color: #fff;
    }

    .create-new-circle i {
      font-size: 32px;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .create-new-circle:hover i {
      color: #fff;
    }

    .create-new-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .profile-stats {
      display: flex;
      gap: 32px;
      margin-bottom: 16px;
    }

    .profile-stat {
      font-size: 15px;
      color: var(--text-secondary);
    }

    .profile-stat strong {
      color: #fff;
      font-weight: 700;
    }

    .profile-fullname {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .profile-bio {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
      white-space: pre-line;
    }

    .profile-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .profile-meta span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .profile-meta a {
      color: var(--accent);
    }

    .profile-meta a:hover {
      text-decoration: underline;
    }

    .profile-role-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      background: var(--accent-muted);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    /* Profile tabs */
    .profile-tabs {
      max-width: 935px;
      margin: 32px auto 0;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      gap: 48px;
    }

    .profile-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 0;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-top: 2px solid transparent;
      margin-top: -1px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .profile-tab:hover { color: var(--text-secondary); cursor: pointer; }
    .profile-tab.active {
      color: #fff;
      border-top-color: #fff;
    }

    /* Profile content grid */
    .profile-content {
      max-width: 935px;
      margin: 24px auto 0;
      padding: 0 24px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .profile-grid-item {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 4px;
      cursor: pointer;
      background: var(--bg-tertiary);
    }

    .profile-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.2s ease;
    }

    .profile-grid-item:hover img { opacity: 0.7; }

    .profile-empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .profile-empty i {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--text-muted);
      opacity: 0.4;
    }

    .profile-empty p {
      font-size: 15px;
      margin-bottom: 8px;
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg, var(--bg-tertiary) 25%, var(--bg-elevated) 50%, var(--bg-tertiary) 75%);
      background-size: 200% 100%;
      animation: skeleton-shimmer 1.5s ease infinite;
      border-radius: 8px;
    }

    @keyframes skeleton-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-avatar { width: 150px; height: 150px; border-radius: 50%; }
    .skeleton-text { height: 16px; border-radius: 4px; }
    .skeleton-text-sm { height: 12px; border-radius: 4px; width: 60%; }
    .skeleton-text-lg { height: 24px; border-radius: 4px; width: 40%; }
    .skeleton-btn { height: 36px; width: 120px; border-radius: 8px; }
    .skeleton-stat { height: 14px; width: 80px; border-radius: 4px; }

    /* Edit Profile Modal */
    .edit-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      animation: fadeIn 0.2s ease;
    }

    .edit-modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90%;
      max-width: 540px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-xl);
    }

    .edit-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg-card);
      z-index: 1;
    }

    .edit-modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin: 0;
    }

    .edit-modal-body { padding: 24px; }

    .edit-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    .edit-avatar-section {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .edit-avatar-preview {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg-tertiary);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .edit-avatar-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edit-avatar-actions label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      cursor: pointer;
    }

    .edit-avatar-actions label:hover { text-decoration: underline; }

    .edit-avatar-actions .remove-avatar {
      font-size: 12px;
      color: var(--error);
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-weight: 500;
    }

    .edit-avatar-actions .remove-avatar:hover { text-decoration: underline; }

    .edit-form .form-group { margin-bottom: 16px; }

    .edit-form .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .edit-form .form-input {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
    }

    .edit-form textarea.form-input {
      min-height: 80px;
      resize: vertical;
    }

    .char-counter {
      text-align: right;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .edit-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 4000;
      animation: fadeUp 0.2s ease;
      box-shadow: var(--shadow-lg);
    }

    .edit-toast.success { background: #065f46; color: #a7f3d0; border: 1px solid rgba(167,243,208,0.2); }
    .edit-toast.error { background: #7f1d1d; color: #fca5a5; border: 1px solid rgba(252,165,165,0.2); }

    /* Responsive */
    @media (max-width: 768px) {
      .profile-header { flex-direction: column; align-items: center; text-align: center; gap: 20px; padding: 24px 16px 0; }
      .profile-avatar { width: 100px; height: 100px; }
      .profile-avatar .avatar-initial { font-size: 40px; }
      .profile-top-row { justify-content: center; }
      .profile-stats { justify-content: center; gap: 24px; }
      .profile-meta { justify-content: center; }
      .profile-role-badge { margin-left: auto; margin-right: auto; }
      .profile-grid { grid-template-columns: repeat(3, 1fr); gap: 2px; }
      .profile-tabs { gap: 24px; }
    }

    @media (max-width: 480px) {
      .profile-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Wait for Supabase to be ready before loading profile
    (async function initProfile() {
      if (!supabaseClient) {
        console.log('[Profile] Waiting for Supabase...');
        setTimeout(initProfile, 100);
        return;
      }

      try {
        await updateNavbarAuth();
        if (typeof renderNotificationBell === 'function') renderNotificationBell();

        // Get username from URL: profile.html?user=username or ?id=uuid
        var params = new URLSearchParams(window.location.search);
        var viewUsername = params.get('user');
        var viewId = params.get('id');
        var session = await getSession();
        console.log('[Profile] Session:', session ? session.user.id : 'null');
        console.log('[Profile] supabaseClient:', !!supabaseClient);

        var profile = null;
        var isOwnProfile = false;
        var isDefaultProfile = false;

        if (viewUsername) {
          // Check if this is a predefined default profile first
          var defaultProf = getDefaultProfile(viewUsername);
          if (defaultProf) {
            profile = defaultProf;
            isDefaultProfile = true;
          } else {
            profile = await loadUserProfile(viewUsername);
          }
        } else if (viewId) {
          profile = await loadUserProfile(viewId);
        } else if (session && session.user) {
          // No param — show own profile
          console.log('[Profile] Loading own profile for user:', session.user.id);
          profile = await getCurrentProfile();
          console.log('[Profile] getCurrentProfile result:', profile);
          isOwnProfile = true;
        }

        console.log('[Profile] Final profile:', profile, 'isOwn:', isOwnProfile, 'isDefault:', isDefaultProfile);

        // If no profile found and no URL params, redirect to login or show message
        if (!profile && !viewUsername && !viewId) {
          // Check if user is logged in but has no profile
          if (session && session.user) {
            // User is logged in but has no profile - show message
            console.log('[Profile] User logged in but no profile found');
            document.getElementById('profileSkeleton').style.display = 'none';
            document.getElementById('profileContent').innerHTML =
              '<div style="text-align:center;padding:80px 24px;color:var(--text-muted);">' +
              '<i class="fas fa-user-plus" style="font-size:48px;margin-bottom:16px;display:block;opacity:0.4;"></i>' +
              '<p style="font-size:16px;margin-bottom:8px;color:#fff;">No profile found</p>' +
              '<p style="font-size:13px;color:var(--text-muted);">Your profile doesn&apos;t exist yet.</p>' +
              '</div>';
            document.getElementById('profileContent').style.display = 'block';
            return;
          } else {
            // Not logged in - redirect to login
            console.log('[Profile] Not logged in, redirecting to login');
            window.location.href = 'login.html';
            return;
          }
        }

        if (!profile) {
          console.log('[Profile] Profile not found for:', viewUsername || viewId);
          document.getElementById('profileSkeleton').style.display = 'none';
          document.getElementById('profileContent').innerHTML =
            '<div style="text-align:center;padding:80px 24px;color:var(--text-muted);">' +
            '<i class="fas fa-user-slash" style="font-size:48px;margin-bottom:16px;display:block;opacity:0.4;"></i>' +
            '<p style="font-size:16px;margin-bottom:8px;color:#fff;">Profile not found</p>' +
            '<p style="font-size:13px;color:var(--text-muted);">The profile you&apos;re looking for doesn&apos;t exist.</p>' +
            '</div>';
          document.getElementById('profileContent').style.display = 'block';
          return;
        }

        // Check if viewing own profile
        if (session && session.user && profile.id === session.user.id) {
          isOwnProfile = true;
        }

        // Render profile
        renderProfile(profile, isOwnProfile);

        document.getElementById('profileSkeleton').style.display = 'none';
        document.getElementById('profileContent').style.display = 'block';

        // Load user's posts — for default profiles, load their creations from DEFAULT_USER_MAP
        if (isDefaultProfile) {
          loadDefaultProfilePosts(profile.username);
        } else {
          loadProfilePosts(profile.id);
          // Load social stats (followers, following counts)
          loadProfileSocialStats(profile.id, isOwnProfile);
        }
      } catch (err) {
        console.error('[Profile] Initialization error:', err);
        document.getElementById('profileSkeleton').style.display = 'none';
        document.getElementById('profileContent').innerHTML =
          '<div style="text-align:center;padding:80px 24px;color:var(--text-muted);">' +
          '<i class="fas fa-triangle-exclamation" style="font-size:48px;margin-bottom:16px;display:block;opacity:0.4;"></i>' +
          '<p style="font-size:16px;margin-bottom:8px;color:#fff;">Something went wrong</p>' +
          '<p style="font-size:13px;color:var(--text-muted);">Failed to load profile. Please refresh or sign in again.</p>' +
          '</div>';
        document.getElementById('profileContent').style.display = 'block';
      }
    })();

    function renderProfile(profile, isOwn) {
      var p = formatProfile(profile);
      var isDefault = profile.id && profile.id.indexOf('default-p-') === 0;

      // Avatar
      var avatarEl = document.getElementById('profileAvatar');
      if (p.avatarUrl) {
        avatarEl.innerHTML = '<img src="' + p.avatarUrl + '" alt="' + p.username + '">';
      } else {
        var initial = (p.fullName || p.username || 'U').charAt(0).toUpperCase();
        avatarEl.innerHTML = '<div class="avatar-initial">' + initial + '</div>';
      }

      // Username
      document.getElementById('profileUsername').textContent = p.username;

      // Stats: default profiles show 0 for social stats (no real relationships), real data from DB for others
      if (isDefault) {
        document.getElementById('postsCount').textContent = _profileCreationCounts.total || 0;
        document.getElementById('followersCount').textContent = '0';
        document.getElementById('followingCount').textContent = '0';
        // Make followers/following non-clickable for default profiles

    // Handle follow from profile page
    window.handleProfileFollow = async function(userId, btn) {
      var prevFollowing = btn.classList.contains('following');
      btn.disabled = true;
      try {
        var nowFollowing = await toggleFollow(userId);
        if (nowFollowing) {
          btn.className = 'follow-btn following';
          btn.innerHTML = '<i class="fas fa-check"></i> Following';
          try {
            if (typeof createNotification === 'function') {
              var me = await getCurrentProfile();
              var name = me ? (me.full_name || me.username) : 'Someone';
              await createNotification(userId, 'follow', null, null, name + ' started following you');
            }
          } catch(e2) {}
        } else {
          btn.className = 'follow-btn follow';
          btn.innerHTML = '<i class="fas fa-plus"></i> Follow';
        }
        loadProfileSocialStats(userId, false);
      } catch(e) {
        if (prevFollowing) {
          btn.className = 'follow-btn following';
          btn.innerHTML = '<i class="fas fa-check"></i> Following';
        } else {
          btn.className = 'follow-btn follow';
          btn.innerHTML = '<i class="fas fa-plus"></i> Follow';
        }
      } finally {
        btn.disabled = false;
      }
    };

    /* ---- Load default profile creations (predefined users) ---- */
    async function loadDefaultProfilePosts(username) {
      _profileUserId = null;
      var grid = document.getElementById('profileGrid');
      var emptyEl = document.getElementById('postsEmpty');
      grid.innerHTML = '';
      emptyEl.style.display = 'none';

      // Find all creations in DEFAULT_USER_MAP that belong to this username
      var creatorTitles = [];
      var writerTitles = [];
      var makerTitles = [];
      for (var title in DEFAULT_USER_MAP) {
        var u = DEFAULT_USER_MAP[title];
        if (u.username === username) {
          // Determine type from title lookup
          var defaultList = [
            { title: 'A Fusion of Naruto and Goku', type: 'creator' },
            { title: 'Super Saiyan Nine Tails', type: 'creator' },
            { title: 'Gear 5 Goku', type: 'creator' },
            { title: 'Ichigo Naruto', type: 'creator' },
            { title: 'Creation 5', type: 'creator' },
            { title: 'Vegetto', type: 'creator' },
            { title: 'Gear 5 Baryon', type: 'creator' },
            { title: 'Lugoto', type: 'creator' },
            { title: 'Luffy as Lil Bro of Goku', type: 'writer' },
            { title: 'Goats as a Trio', type: 'writer' },
            { title: 'Ramen Lovers Together', type: 'writer' },
            { title: 'The Last Battle', type: 'writer' },
            { title: 'Team Goats', type: 'writer' },
            { title: 'Jack Luffy', type: 'writer' },
            { title: 'Pirate Slayer', type: 'writer' },
            { title: 'Unbeatable Combo', type: 'writer' },
            { title: 'Nine Tails VS Gear 5', type: 'maker' },
            { title: 'Battle of G.OA.Ts', type: 'maker' },
            { title: 'Battle of G.O.A.T.s', type: 'maker' },
            { title: 'Dominance of Aizen', type: 'maker' },
            { title: 'Battle of Instant', type: 'maker' },
            { title: 'Clash of Legends', type: 'maker' },
            { title: 'The New Member of Akatsuki', type: 'maker' },
            { title: 'The End of Muzan', type: 'maker' },
            { title: 'Fight of Senseis', type: 'maker' },
            { title: 'The END', type: 'maker' }
          ];
          for (var j = 0; j < defaultList.length; j++) {
            if (defaultList[j].title === title) {
              if (defaultList[j].type === 'creator') creatorTitles.push(title);
              else if (defaultList[j].type === 'writer') writerTitles.push(title);
              else makerTitles.push(title);
            }
          }
        }
      }

      // Fetch from Supabase by title matching
      var allCreations = [];
      for (var i = 0; i < CREATION_TYPES.length; i++) {
        var type = CREATION_TYPES[i];
        var { data: creations } = await supabaseClient
          .from('creations')
          .select('*')
          .eq('type', type)
          .limit(50);
        if (creations) {
          // Filter to only titles belonging to this user
          var userTitles = type === 'creator' ? creatorTitles : type === 'writer' ? writerTitles : makerTitles;
          var filtered = creations.filter(function(c) { return userTitles.indexOf(c.title) !== -1; });
          allCreations = allCreations.concat(filtered.map(function(c) { c._displayProfile = getDefaultUser(c) || {}; return c; }));
        }
      }

      // Separate by type
      _profileCreations.creator = allCreations.filter(function(c) { return c.type === 'creator'; });
      _profileCreations.writer = allCreations.filter(function(c) { return c.type === 'writer'; });
      _profileCreations.maker = allCreations.filter(function(c) { return c.type === 'maker'; });
      _profileCreationCounts.creator = _profileCreations.creator.length;
      _profileCreationCounts.writer = _profileCreations.writer.length;
      _profileCreationCounts.maker = _profileCreations.maker.length;
      _profileCreationCounts.total = allCreations.length;

      document.getElementById('postsCount').textContent = _profileCreationCounts.total;
      document.getElementById('tabCreatorCount').textContent = _profileCreationCounts.creator;
      document.getElementById('tabWriterCount').textContent = _profileCreationCounts.writer;
      document.getElementById('tabMakerCount').textContent = _profileCreationCounts.maker;

      // Default to creator tab
      showProfileTab('creator');
    }

    function showProfileTab(tab) {
      _currentProfileTab = tab;
      var grid = document.getElementById('profileGrid');
      var emptyEl = document.getElementById('postsEmpty');
      grid.innerHTML = '';

      // Update active tab
      document.querySelectorAll('.profile-creation-tab').forEach(function(el) {
        el.classList.toggle('active', el.getAttribute('data-tab') === tab);
      });

      // Handle saved tab
      if (tab === 'saved') {
        loadSavedTab();
        return;
      }

      var items = _profileCreations[tab] || [];
      if (items.length === 0) {
        grid.style.display = 'none';
        emptyEl.style.display = 'block';
        var emptyIcon = tab === 'creator' ? 'fa-image' : tab === 'writer' ? 'fa-pen-nib' : 'fa-video';
        var emptyText = tab === 'creator' ? 'No creations yet' : tab === 'writer' ? 'No stories yet' : 'No animations yet';
        emptyEl.innerHTML = '<i class="fas ' + emptyIcon + '" style="font-size:48px;color:var(--text-muted);margin-bottom:16px;display:block;opacity:0.4;"></i>' +
          '<p style="font-size:16px;color:var(--text-secondary);margin-bottom:8px;">' + emptyText + '</p>' +
          '<span style="font-size:14px;color:var(--text-muted);">Share your first ' + tab + ' creation.</span>';
        return;
      }

      emptyEl.style.display = 'none';
      grid.style.display = 'grid';

      renderProfileGridItems(items, grid);
    }

    async function loadSavedTab() {
      var grid = document.getElementById('profileGrid');
      var emptyEl = document.getElementById('postsEmpty');
      grid.innerHTML = '';
      grid.style.display = 'none';
      emptyEl.style.display = 'block';
      emptyEl.innerHTML = '<i class="fas fa-spinner fa-spin" style="font-size:24px;color:var(--text-muted);"></i>';

        emptyEl.innerHTML = '<i class="fas fa-bookmark" style="font-size:48px;color:var(--text-muted);margin-bottom:16px;display:block;opacity:0.4;"></i>' +

          '<span style="font-size:14px;color:var(--text-muted);">Bookmark creations to see them here.</span>';

      grid.style.display = 'grid';

    function renderProfileGridItems(items, grid) {
      items.forEach(function(c) {
        var item = document.createElement('div');
        item.className = 'post-grid-item';
        item.style.cursor = 'pointer';
        var clickFn = c.type === 'creator' ? 'openCreatorDetail' : c.type === 'writer' ? 'openStoryDetail' : 'openMakerDetail';
        item.onclick = function() { window[clickFn](c.id); };

        if (c.type === 'writer') {
          if (c.cover_image_url) {
            item.innerHTML = '<img src="' + c.cover_image_url + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;">';
          } else {
            item.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);"><i class="fas fa-pen-nib" style="font-size:24px;color:var(--text-muted);"></i></div>';
          }
        } else if (c.type === 'maker') {
          var thumb = c.cover_image_url || c.media_url;
          item.innerHTML = '<img src="' + thumb + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;">' +
            '<div class="post-grid-overlay"><span class="post-grid-stat"><i class="fas fa-play"></i></span></div>';
        } else {
          item.innerHTML = '<img src="' + (c.cover_image_url || '') + '" loading="lazy" style="width:100%;height:100%;object-fit:cover;">';
        }
        grid.appendChild(item);
      });

          '<div class="form-group"><label>Story title *</label><input type="text" id="pTitle" placeholder="Give your story a title" maxlength="150"></div>' +
          '<div class="form-group"><label>Short summary</label><input type="text" id="pShortDesc" placeholder="A brief summary" maxlength="300"></div>' +
          '<div class="form-group"><label>Story content *</label><textarea id="pStoryContent" class="story-editor" placeholder="Write your story here..." maxlength="50000"></textarea></div>';
      } else {
        formHtml =
          '<div class="create-upload-zone" id="pDropzone"><div class="create-upload-zone-icon"><i class="fas fa-cloud-arrow-up"></i></div><h4>Upload your video</h4><p class="file-types">' + types + '</p></div>' +
          '<div class="create-upload-preview" id="pPreview"></div>' +
          '<input type="file" id="pFileInput" style="display:none" accept="' + accept + '">' +
          '<div class="form-group"><label>Video title *</label><input type="text" id="pTitle" placeholder="Name your video" maxlength="150"></div>' +
          '<div class="form-group"><label>Description</label><textarea id="pDesc" placeholder="Describe your video..." maxlength="2000" rows="3"></textarea></div>' +
          '<div class="create-upload-zone" id="pThumbDropzone" style="padding:16px;"><p style="margin:0;font-size:13px;color:var(--text-muted);"><i class="fas fa-image" style="margin-right:6px;"></i> Upload thumbnail (optional)</p></div>' +
          '<div class="create-upload-preview" id="pThumbPreview"></div>' +
          '<input type="file" id="pThumbInput" style="display:none" accept="image/jpeg,image/png,image/webp,image/gif">';
      }

      modal.innerHTML = '<div class="create-modal-overlay" onclick="if(event.target===this)closeCreatePostProfile()">' +
        '<div class="create-modal" onclick="event.stopPropagation()">' +
          '<div class="create-modal-header"><button class="upload-modal-close" onclick="renderPTypeSelector(document.getElementById(\'createPostModal\'))" style="margin-right:8px;"><i class="fas fa-arrow-left"></i></button><h3>Create ' + header + '</h3><button class="upload-modal-close" onclick="closeCreatePostProfile()"><i class="fas fa-xmark"></i></button></div>' +
          '<div class="create-modal-body">' +
            '<div id="pUploadProgress" class="create-upload-progress"><div class="create-progress-bar-bg"><div class="create-progress-bar" id="pProgressBar"></div></div><div class="create-progress-text" id="pProgressText">Uploading...</div></div>' +
            formHtml +
          '</div>' +
          '<div class="create-modal-footer">' +
            '<button class="btn btn-secondary" onclick="closeCreatePostProfile()">Cancel</button>' +
            '<button class="btn btn-primary" id="pPublishBtn" onclick="handlePPublish()"><i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish</button>' +
          '</div>' +
        '</div>' +
      '</div>';

      setupPCDropzone('pDropzone', 'pFileInput', 'pPreview', function(f) { _pCreateFile = f; });
      if (type === 'maker') {
        setupPCDropzone('pThumbDropzone', 'pThumbInput', 'pThumbPreview', function(f) { _pCreateCover = f; });
      }
    };

    function setupPCDropzone(dzId, fiId, previewId, onFile) {
      var dz = document.getElementById(dzId);
      var fi = document.getElementById(fiId);
      if (!dz || !fi) return;
      dz.addEventListener('click', function() { fi.click(); });
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragover'); });
      dz.addEventListener('dragleave', function() { dz.classList.remove('dragover'); });
      dz.addEventListener('drop', function(e) { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) showPFilePreview(e.dataTransfer.files[0], previewId, dzId, onFile); });
      fi.addEventListener('change', function(e) { if (e.target.files[0]) showPFilePreview(e.target.files[0], previewId, dzId, onFile); });
    }

    function showPFilePreview(file, previewId, dzId, onFile) {
      var isImage = VALID_IMAGE_TYPES.includes(file.type);
      var isVideo = VALID_VIDEO_TYPES.includes(file.type);
      if (!isImage && !isVideo) { showToast('Unsupported file type.', 'error'); return; }
      if (isImage && file.size > MAX_IMAGE_SIZE) { showToast('Image must be less than 10MB.', 'error'); return; }
      if (isVideo && file.size > MAX_VIDEO_SIZE) { showToast('Video must be less than 100MB.', 'error'); return; }
      onFile(file);
      var preview = document.getElementById(previewId);
      var dz = document.getElementById(dzId);
      var reader = new FileReader();
      reader.onload = function(e) {
        var mediaHtml = isVideo
          ? '<video src="' + e.target.result + '" controls preload="metadata" style="width:100%;max-height:250px;border-radius:8px;"></video>'
          : '<img src="' + e.target.result + '" style="width:100%;max-height:250px;object-fit:cover;border-radius:8px;">';
        preview.innerHTML = mediaHtml + '<button class="preview-remove" onclick="event.stopPropagation();this.parentElement.classList.remove(\'active\');this.parentElement.innerHTML=\'\';document.getElementById(\'' + dzId + '\').style.display=\'\';"><i class="fas fa-xmark"></i></button>';
        preview.classList.add('active');
        if (dz) dz.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    window.handlePPublish = async function() {
      var btn = document.getElementById('pPublishBtn');
      if (!btn) return;
      var title = ((document.getElementById('pTitle') || {}).value || '').trim();
      if (!title) { showToast('Please enter a title.', 'error'); return; }

      var progressEl = document.getElementById('pUploadProgress');
      var barEl = document.getElementById('pProgressBar');
      var textEl = document.getElementById('pProgressText');

      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div> Publishing...';
      if (progressEl) progressEl.classList.add('active');

      try {
        var data = { type: _pCreateType, title: title };
        if (_pCreateType === 'creator') {
          var shortD = ((document.getElementById('pShortDesc') || {}).value || '').trim();
          var desc = ((document.getElementById('pDesc') || {}).value || '').trim();
          if (!desc) { showToast('Please add a description.', 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish'; return; }
          data.description = shortD + '\n\n' + desc;
          var r = await uploadCreationFile(_pCreateFile, 'uploads', function(p) { if (barEl) barEl.style.width = p + '%'; if (textEl) textEl.textContent = p < 100 ? 'Uploading... ' + p + '%' : 'Processing...'; });
          data.cover_image_url = r.url;
        } else if (_pCreateType === 'writer') {
          var shortD = ((document.getElementById('pShortDesc') || {}).value || '').trim();
          var story = ((document.getElementById('pStoryContent') || {}).value || '').trim();
          if (!story) { showToast('Please write your story.', 'error'); btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish'; return; }
          data.description = shortD; data.story_content = story;
          if (_pCreateFile) { var r = await uploadCreationFile(_pCreateFile, 'uploads', function(p) { if (barEl) barEl.style.width = p + '%'; if (textEl) textEl.textContent = p < 100 ? 'Uploading cover... ' + p + '%' : 'Processing...'; }); data.cover_image_url = r.url; }
        } else {
          var desc = ((document.getElementById('pDesc') || {}).value || '').trim();
          data.description = desc;
          var r = await uploadCreationFile(_pCreateFile, 'uploads', function(p) { if (barEl) barEl.style.width = p + '%'; if (textEl) textEl.textContent = p < 100 ? 'Uploading video... ' + p + '%' : 'Processing...'; });
          data.media_url = r.url;
          if (_pCreateCover) { var tr = await uploadCreationFile(_pCreateCover, 'uploads', function() {}); data.cover_image_url = tr.url; }
        }
        await createCreation(data);
        closeCreatePostProfile();
        showToast('Creation published!', 'success');
        var profile = await getCurrentProfile();
        if (profile) { renderProfile(profile, true); loadProfilePosts(profile.id); }
      } catch (err) {
        showToast(err.message || 'Failed to publish.', 'error');
        btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish';
        if (progressEl) progressEl.classList.remove('active');
      }
    };

    window.closeCreatePostProfile = function() {
      document.getElementById('createPostModal').style.display = 'none';
      _pCreateType = null; _pCreateFile = null; _pCreateCover = null;
    };

    window.removeAvatar = async function() {
      try {
        await updateUserProfile({ avatar_url: '' });
        var profile = await getCurrentProfile();
        if (profile) renderProfile(profile, true);
        await updateNavbarAuth();
        showToast('Profile photo removed', 'success');
        closeEditProfile();
      } catch (err) {
        showToast(err.message, 'error');
      }
    };

    window.saveProfile = async function() {
      var btn = document.getElementById('saveProfileBtn');
      if (!btn) return;
      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div> Saving...';

      try {
        var updates = {
          full_name: document.getElementById('editFullName').value.trim(),
          username: document.getElementById('editUsername').value.trim(),
          bio: document.getElementById('editBio').value.trim(),
          role: document.getElementById('editRole').value,
          website: document.getElementById('editWebsite').value.trim(),
          location: document.getElementById('editLocation').value.trim()
        };

        await updateUserProfile(updates);
        closeEditProfile();
        showToast('Profile updated!', 'success');

        // Re-render profile
        var profile = await getCurrentProfile();
        if (profile) renderProfile(profile, true);
        await updateNavbarAuth();
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check" style="margin-right:6px;"></i>Save Changes';
      }
    };

    function escapeAttr(str) {
      return str.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
