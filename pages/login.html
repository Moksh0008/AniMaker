<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="auth-logo">
        <img src="../assets/images/logo.png" alt="AniMaker">
        <span>AniMaker</span>
      </a>
      <h2>Welcome back</h2>
      <p class="auth-subtitle">Log in to your account to continue creating</p>

      <div id="errorMessage" style="display:none;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:20px;font-size:13px;color:var(--error);"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="loginBtn" style="width:100%; margin-top:8px;">
          <span id="loginText"><i class="fas fa-arrow-right"></i> Log In</span>
          <span id="loginSpinner" style="display:none;"><div class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></div> Signing in...</span>
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (isLoggedIn()) {
      window.location.href = '../index.html';
    }

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('errorMessage');
    const loginBtn = document.getElementById('loginBtn');
    const loginText = document.getElementById('loginText');
    const loginSpinner = document.getElementById('loginSpinner');

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      errorDiv.style.display = 'none';
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginText.style.display = loading ? 'none' : 'inline';
      loginSpinner.style.display = loading ? 'inline-flex' : 'none';
    }

    // Determine where to go after login
    var redirectTo = getRedirectUrl();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('Please fill in all fields');
        return;
      }

      setLoading(true);

      try {
        var data = await apiRequest('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email: email, password: password })
        });

        setToken(data.token);
        setUser(data.user);

        // Redirect to requested page, or homepage
        if (redirectTo) {
          window.location.href = '../' + redirectTo;
        } else {
          window.location.href = '../index.html';
        }
      } catch (error) {
        showError(error.message);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
