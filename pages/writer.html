  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .auth-loading-overlay { animation: hideOverlay 2s forwards; }
    @keyframes hideOverlay { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

    /* ---- Watermark-style cards (Pinterest masonry) ---- */
    .story-card {
      position: relative;
      margin: 0 0 16px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--bg-tertiary);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      break-inside: avoid;
    }
    .story-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    /* Natural-height image (Pinterest style) */
    .story-card-img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* Dim the image so it reads like a watermark */
    .story-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.4);
      transition: background 0.2s ease;
      z-index: 0;
      pointer-events: none;
    }
    .story-card:hover::before {
      background: rgba(10, 10, 15, 0.2);
    }
    /* Bottom scrim for title readability */
    .story-card-scrim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
      z-index: 1;
      pointer-events: none;
    }
    .story-card.no-cover {
      background: linear-gradient(145deg, var(--bg-elevated), var(--bg-tertiary));
      min-height: 170px;
    }
    .story-card-title {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 56px;
      z-index: 2;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.3;
      text-align: left;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      pointer-events: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .story-card-user {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 4px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
    }
    .story-card-user img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }
    .story-card-owner {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      display: flex;
      gap: 6px;
    }
    .story-card-actions {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .story-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .story-card-action:hover {
      background: var(--accent);
      transform: scale(1.08);
    }
    .story-card-action.liked i { color: #ff4d6d; }
    .story-card-action.saved i { color: var(--accent); }
  </style>

    var seedStories = [
      { id: 'default-w1', title: 'Luffy as Lil Bro of Goku', cover_image_url: '../assets/images/writer/writer-pic-1.jpg', genre: 'Fan Fiction', tags: ['luffy','goku','crossover'],
        story_content: 'In a small, peaceful village on Earth, Goku\'s younger brother, Luffy, was born. Unlike Goku, Luffy\'s personality was fiery and impulsive, often getting himself into trouble with his mischievous adventures. Growing up under the same roof, the two brothers formed a bond like no other, each pushing the other to grow stronger.\n\nLuffy, always eager to fight, would often challenge Goku to sparring matches, only to be defeated effortlessly. But Luffy didn\'t mind; every loss made him stronger, and every challenge gave him more fire. "One day, I\'ll be as strong as you!" he\'d shout with a grin, despite his bruises.\n\nAs they grew, the two adventurers set off on separate journeys. Goku pursued his dreams of becoming the world\'s greatest martial artist, while Luffy set his sights on the Grand Line, declaring himself the future Pirate King. Their paths were different, but both had the same unyielding drive.\n\nGoku would often send Luffy letters with encouragement, but Luffy\'s only reply would be a laughing message: "I\'m already on my way to being the King of the Sea, big bro!"\n\nYears later, Luffy\'s name became known across the seas, just as Goku\'s became known across the universe. And though they fought different battles, the bond of family and adventure would always keep them connected.' },
      { id: 'default-w2', title: 'Goats as a Trio', cover_image_url: '../assets/images/writer/writer-pic-2.jpg', genre: 'Adventure', tags: ['naruto','luffy','goku'],
        story_content: 'Naruto, Luffy, and Goku were three young adventurers brought together by fate in a world where ninjas, pirates, and martial artists lived side by side. Though their personalities were completely different, they quickly became inseparable. Goku was calm and fearless, Luffy was wild and cheerful, while Naruto was determined and never willing to give up.\n\nThey would often train together, turning every practice session into a friendly competition. Goku challenged them to test their strength, Luffy rushed into every fight with a huge grin, and Naruto refused to let either of them get ahead. Even when they lost, they would laugh, learn, and promise to become stronger together.\n\nAs they grew older, each of them began chasing their own dream. Goku wanted to become the greatest martial artist, Luffy dreamed of becoming the Pirate King, and Naruto wanted to become Hokage and earn the respect of everyone around him.\n\nYears later, their names became legends across the world. No matter how far their journeys took them, the three friends always found their way back to each other.' },
      { id: 'default-w3', title: 'Ramen Lovers Together', cover_image_url: '../assets/images/writer/writer-pic-3.jpg', genre: 'Slice of Life', tags: ['ramen','friends'],
        story_content: 'There was something magical about a warm bowl of ramen that brought even the greatest warriors together. Every Sunday evening, Naruto, Goku, and Luffy would gather at Ichiraku Ramen, the only place in the world where a Hokage, a Saiyan, and a Pirate King could sit side by side and simply enjoy a meal.\n\nNaruto always ordered the same thing — miso ramen with extra pork. Goku, being Goku, ordered ten bowls of everything. Luffy would eat until the entire shop ran out of ingredients, laughing the whole time.\n\n"You know," Naruto said between slurps, "this is the best part of my day." Goku nodded, his mouth full of noodles. Luffy grinned, sauce on his face. "Better than treasure!" he declared.\n\nThey talked about their adventures, their dreams, and their friends. In those quiet moments over steaming bowls of ramen, they weren\'t legends or heroes — they were just three friends, sharing a meal and a bond that would last forever.' },
      { id: 'default-w4', title: 'The Last Battle', cover_image_url: '../assets/images/writer/writer-pic-4.jpg', genre: 'Action', tags: ['battle','trio'],
        story_content: 'The sky turned dark as the ultimate threat emerged — a villain so powerful that even the gods trembled. Naruto, Goku, and Luffy stood side by side, facing the enemy that threatened to destroy everything they had ever loved.\n\n"Ready?" Goku asked, his voice calm despite the chaos around them. Naruto grinned, his eyes blazing with determination. "Always." Luffy cracked his knuckles, his hat pulled low. "Let\'s do this."\n\nThe battle was unlike anything the world had ever seen. Goku transformed through his forms, his power reaching new heights with every blow. Naruto unleashed the full force of the Nine-Tails, his chakra painting the sky in golden light. Luffy activated Gear 5, his body bending reality itself.\n\nTogether, they were unstoppable. When the final blow landed, the darkness shattered like glass, and the sun broke through the clouds.\n\nBreathing heavily, the three warriors looked at each other and smiled. They had won — not alone, but together. That was the power of friendship, the power of three legends who refused to give up.' },
      { id: 'default-w5', title: 'Team Goats', cover_image_url: '../assets/images/writer/writer-pic-5.jpg', genre: 'Adventure', tags: ['goats','legends'],
        story_content: 'In a world where power meant everything, three names echoed across every land, every sea, every universe — Goku, Naruto, and Luffy. They were known as the GOATs, the Greatest Of All Time.\n\nBut fame never changed them. Goku still trained every morning with a smile. Naruto still visited his friends in the Hidden Leaf Village. Luffy still gathered his crew, laughing and dreaming of new adventures on the Grand Line.\n\nThey met once a year at a secret location — a small island in the middle of the ocean. There, they would train, fight, eat, and share stories. No cameras, no fans, no titles. Just three friends being themselves.\n\n"You know what I love most?" Luffy said one evening, watching the sunset. "This. Just us." Goku nodded, stretching his arms behind his head. Naruto smiled. "Me too. This is what it\'s all about."' },
      { id: 'default-w6', title: 'Jack Luffy', cover_image_url: '../assets/images/writer/writer-pic-6.jpg', genre: 'Adventure', tags: ['luffy','pirates'],
        story_content: 'Monkey D. Luffy had always been fearless, but when he discovered the legendary treasure of Gol D. Roger, everything changed. The treasure wasn\'t gold or jewels — it was a map to a hidden island where the greatest pirates in history had left their legacy.\n\nLuffy gathered his crew and set sail immediately. "We\'re going to find this treasure!" he declared. The journey was filled with challenges — treacherous storms, powerful enemies, and impossible obstacles.\n\nWhen they finally reached the island, Luffy found something unexpected — a letter from Gol D. Roger himself. "The real treasure isn\'t on this island," it read. "It\'s the journey you took to get here, and the friends who traveled with you."\n\nLuffy laughed, holding the letter to his chest. "He\'s right!" he said, looking at his crew. "You guys are my treasure!"' },
      { id: 'default-w7', title: 'Pirate Slayer', cover_image_url: '../assets/images/writer/writer-pic-7.jpg', genre: 'Action', tags: ['zoro','swordsman'],
        story_content: 'They called him the Pirate Slayer, but that wasn\'t quite right. Roronoa Zoro didn\'t slay pirates for money or fame — he did it because it was the right thing to do. With his three swords and an unbreakable will, he had earned a reputation as the most feared swordsman in the world.\n\nHis journey began in a small village where he trained under a master swordsman. "To become truly strong," his master told him, "you must fight for something more than yourself."\n\nAlong the way, he met friends who changed his life. He joined Luffy\'s crew, finding brothers in the Straw Hat Pirates. He trained with Mihawk, his rival and inspiration. He faced death more times than he could count, but each time he rose stronger.\n\n"The world will know my name," Zoro once said, "as the greatest swordsman who ever lived."' },
      { id: 'default-w8', title: 'Unbeatable Combo', cover_image_url: '../assets/images/writer/writer-pic-8.jpg', genre: 'Action', tags: ['trio','combo'],
        story_content: 'In the entire multiverse, there was one combination that no enemy could defeat — the Unbeatable Combo of Goku, Naruto, and Luffy. Together, they had faced gods, aliens, demons, and pirates, and they had never lost.\n\nThe secret to their power wasn\'t just their individual strength — it was how they worked together. Goku\'s raw power, Naruto\'s strategic mind, and Luffy\'s unpredictable fighting style created a combination that was impossible to counter.\n\nWhen Goku attacked with a Kamehameha, Naruto would follow with a Rasenshuriken, and Luffy would finish with a Gear 5 punch that bent reality itself.\n\n"We\'re unstoppable!" Luffy would shout after every victory. Goku would laugh, rubbing the back of his head. Naruto would grin, crossing his arms. "Believe it!"\n\nThe Unbeatable Combo wasn\'t just a fighting team — it was a family, bound by friendship, loyalty, and the shared dream of protecting the world they loved.' }

    /* ---- Like / Save handlers for story cards ---- */
    async function handleStoryLike(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('liked');
      btn.classList.toggle('liked');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('liked') ? 'fas fa-heart' : 'far fa-heart';
      var countEl = btn.querySelector('.story-like-count');
      var n = parseInt(countEl.textContent) || 0;
      countEl.textContent = btn.classList.contains('liked') ? n + 1 : Math.max(0, n - 1);
      try {
        var nowLiked = await toggleLike(id);
        if (nowLiked && typeof createNotification === 'function') {
          try {
            var c = await fetchCreation(id);
            if (c && c.user_id) {
              var me = await getCurrentProfile();
              var myName = me ? (me.full_name || me.username) : 'Someone';
              await createNotification(c.user_id, 'like', id, null, myName + ' liked your creation');
            }
          } catch (e2) {}
        }
      } catch (e) {
        btn.classList.toggle('liked');
        iconEl.className = prev ? 'fas fa-heart' : 'far fa-heart';
        countEl.textContent = n;
      }
    }

    async function handleStorySave(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('saved');
      btn.classList.toggle('saved');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('saved') ? 'fas fa-bookmark' : 'far fa-bookmark';
      var labelEl = btn.querySelector('.story-save-label');
      if (labelEl) labelEl.textContent = btn.classList.contains('saved') ? 'Saved' : 'Save';
      try {
        await toggleSave(id);
        if (typeof syncSaveButton === 'function') {
          document.querySelectorAll('[data-save-for="' + id + '"]').forEach(function(o) { syncSaveButton(o, btn.classList.contains('saved')); });
        }
      } catch (e) {
        btn.classList.toggle('saved');
        iconEl.className = prev ? 'fas fa-bookmark' : 'far fa-bookmark';
        if (labelEl) labelEl.textContent = prev ? 'Saved' : 'Save';
      }
    }

    /* ---- Hydrate like/save state on visible cards (3 batched queries) ---- */
    async function hydrateStoryCards() {
      var cards = document.querySelectorAll('.story-card[data-creation-id]');
      if (!cards.length) return;

      // Collect card ids
      var ids = [];
      for (var i = 0; i < cards.length; i++) ids.push(cards[i].getAttribute('data-creation-id'));

      // 1) Batch-fetch ALL like counts in ONE query (public read allowed on creation_likes)
      try {
        var { data: likeRows, error: likeErr } = await supabaseClient
          .from('creation_likes')
          .select('creation_id')
          .in('creation_id', ids);
        if (!likeErr && likeRows) {
          var counts = {};
          likeRows.forEach(function(r) { counts[r.creation_id] = (counts[r.creation_id] || 0) + 1; });
          ids.forEach(function(id) {
            var btn = document.querySelector('.story-card[data-creation-id="' + id + '"] .story-card-action.like .story-like-count');
            if (btn) btn.textContent = counts[id] || 0;
          });
        }
      } catch (e1) { /* counts stay at 0 */ }

      // 2) Batch-fetch MY liked + saved state in TWO queries (requires session)
      var session = await getSession();
      if (!session || !session.user) return;

      var likedMap = {}, savedMap = {};
      try {
        likedMap = await getMyLikedCreationIds(ids) || {};
        savedMap = await getSavedCreationIds(ids) || {};
      } catch (e2) { return; }

      ids.forEach(function(id) {
        var card = document.querySelector('.story-card[data-creation-id="' + id + '"]');
        if (!card) return;
        if (likedMap[id]) {
          var lb = card.querySelector('.story-card-action.like');
          if (lb) { lb.classList.add('liked'); var li = lb.querySelector('i'); if (li) li.className = 'fas fa-heart'; }
        }
        if (savedMap[id]) {
          var sb = card.querySelector('.story-card-action.save');
          if (sb) {
            sb.classList.add('saved');
            var si = sb.querySelector('i');
            if (si) si.className = 'fas fa-bookmark';
            var sl = sb.querySelector('.story-save-label');
            if (sl) sl.textContent = 'Saved';
          }
        }
      });
    }

            '<div class="upload-modal-footer">' +
              '<button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>' +
              '<button class="btn btn-primary" id="saveEditBtn" onclick="handleSaveEdit(\'' + c.id + '\')"><i class="fas fa-check" style="margin-right:6px;"></i>Save</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

    async function handleSaveEdit(id) {
      var btn = document.getElementById('saveEditBtn');
      btn.disabled = true;
      var title = (document.getElementById('editTitle') || {}).value || '';
      var summary = (document.getElementById('editSummary') || {}).value || '';
      var genre = (document.getElementById('editGenre') || {}).value || '';
      var tagsStr = (document.getElementById('editTags') || {}).value || '';
      var storyContent = (document.getElementById('editStoryContent') || {}).value || '';
      if (!title.trim()) { showToast('Title is required.', 'error'); btn.disabled = false; return; }
      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });
      try {
        await updateCreation(id, { title: title.trim(), description: summary.trim(), genre: genre, tags: tags, story_content: storyContent });
        closeEditModal();
        showToast('Story updated!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to update.', 'error');
        btn.disabled = false;
      }
    }

    /* ---- Delete ---- */
    async function handleDelete(id) {
      var confirmed = await showConfirm('Delete Story', 'Are you sure you want to delete this story? This action cannot be undone.');
      if (!confirmed) return;
      try { await deleteCreation(id); showToast('Deleted.', 'success'); var card = document.querySelector('[data-creation-id="' + id + '"]'); if (card) card.remove(); checkEmpty(); }
      catch (err) { showToast(err.message || 'Failed to delete.', 'error'); }
    }

    function checkEmpty() {
      var gallery = document.getElementById('writerGallery');
      var empty = document.getElementById('galleryEmpty');
      var cards = gallery.querySelectorAll('.story-card');
      if (cards.length === 0) empty.classList.add('active'); else empty.classList.remove('active');
    }

    function renderSupabaseCard(c) {
      var profile = getDefaultUser(c) || c.profiles || {};
      var card = document.createElement('div');
      card.className = 'story-card' + (c.cover_image_url ? '' : ' no-cover');
      card.setAttribute('data-creation-id', c.id);
      var imgHtml = c.cover_image_url
        ? '<img class="story-card-img" src="' + c.cover_image_url + '" loading="lazy" alt="' + postEscapeHtml(c.title) + '">'
        : '';
      card.onclick = function(e) { if (e.target.closest('.story-card-action')) return; openStoryDetail(c.id); };
      var userName = getCreationUserName(profile);
      var userAvatar = profile.avatar_url
        ? '<img src="' + profile.avatar_url + '" alt="">'
        : '<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">' + userName.charAt(0).toUpperCase() + '</div>';
      card.innerHTML =
        imgHtml +
        '<div class="story-card-scrim"></div>' +
        '<div class="story-card-user">' + userAvatar + '<span>' + postEscapeHtml(userName) + '</span></div>' +
        '<div class="story-card-title">' + postEscapeHtml(c.title) + '</div>' +
        '<div class="story-card-actions">' +
          '<button class="story-card-action like" onclick="event.stopPropagation();handleStoryLike(\'' + c.id + '\', this)"><i class="far fa-heart"></i> <span class="story-like-count">0</span></button>' +
          '<button class="story-card-action" onclick="event.stopPropagation();openStoryDetail(\'' + c.id + '\')"><i class="far fa-comment"></i></button>' +
          '<button class="story-card-action save" data-save-for="' + c.id + '" onclick="event.stopPropagation();handleStorySave(\'' + c.id + '\', this)"><i class="far fa-bookmark"></i> <span class="story-save-label">Save</span></button>' +
        '</div>';
      return card;
    }

    /* ---- One-time seeding: insert the sample stories as REAL posts ----
       Runs once per browser (localStorage flag). Stories are inserted
       owned by the currently signed-in user, so they get full
       like/comment/save functionality for everyone. */
    async function seedSampleStories() {
      if (!supabaseClient) return;
      var session = await getSession();
      if (!session || !session.user) return; // seeding needs an owner
      if (localStorage.getItem('animaker_writer_seeded')) return;

      try {
        var { data: existing } = await supabaseClient
          .from('creations')
          .select('title')
          .eq('type', 'writer')
          .in('title', seedStories.map(function(s) { return s.title; }));
        var have = {};
        (existing || []).forEach(function(r) { have[r.title] = true; });

        var rows = seedStories
          .filter(function(s) { return !have[s.title]; })
          .map(function(s) {
            return {
              user_id: session.user.id,
              type: 'writer',
              title: s.title,
              description: s.description || '',
              genre: s.genre || '',
              tags: s.tags || [],
              cover_image_url: s.cover_image_url || '',
              story_content: s.story_content || ''
            };
          });

        if (rows.length) await supabaseClient.from('creations').insert(rows);
        localStorage.setItem('animaker_writer_seeded', '1');
        console.log('[Writer] Seeded ' + rows.length + ' sample stories.');
      } catch (e) {
        console.warn('[Writer] Seeding skipped:', e.message || e);
      }
    }

    /* ---- Load Gallery ---- */
    async function loadGallery() {
      var container = document.getElementById('writerGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';
      container.innerHTML = '';

      await seedSampleStories();

      var creations = [];
      try { creations = await fetchCreations({ limit: 50, type: 'writer' }); } catch(e) { console.error('[Writer] fetch error:', e); }
      loading.style.display = 'none';

      creations.forEach(function(c) { container.appendChild(renderSupabaseCard(c)); });

      checkEmpty();
      hydrateStoryCards();
    }
  </script>
</body>
</html>
