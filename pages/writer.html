<html lang="en">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="user-badge"><div class="user-badge-avatar"><i class="fas fa-user"></i></div> User</div>
    </div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-logo"><img src="../assets/images/logo.png" alt="AniMaker"></a>
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link active"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link"><i class="fas fa-cube"></i><span>Maker</span></a>
        <div class="sidebar-divider"></div>
        <a href="services.html" class="sidebar-link"><i class="fas fa-th-large"></i><span>Services</span></a>
        <a href="contact.html" class="sidebar-link"><i class="fas fa-envelope"></i><span>Contact</span></a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <h1>Writer Gallery</h1>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search stories..."></div>
        </div>
        <div class="gallery">
          <a href="writer-pic1.html" class="gallery-item"><img src="../assets/images/writer/writer-pic-1.jpg" alt="Luffy as Lil Bro of Goku"><div class="gallery-overlay"><span>Luffy as Lil Bro of Goku</span></div></a>
          <a href="writer-pic2.html" class="gallery-item"><img src="../assets/images/writer/writer-pic-2.jpg" alt="Goats as a Trio"><div class="gallery-overlay"><span>Goats as a Trio</span></div></a>
          <a href="../assets/images/writer/writer-pic-3.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-3.jpg" alt="Ramen Lovers"><div class="gallery-overlay"><span>Ramen Lovers Together</span></div></a>
          <a href="../assets/images/writer/writer-pic-4.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-4.jpg" alt="Story 4"><div class="gallery-overlay"><span>Story 4</span></div></a>
          <a href="../assets/images/writer/writer-pic-5.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-5.jpg" alt="Team Goats"><div class="gallery-overlay"><span>Team Goats</span></div></a>
          <a href="../assets/images/writer/writer-pic-6.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-6.jpg" alt="Jack Luffy"><div class="gallery-overlay"><span>Jack Luffy</span></div></a>
          <a href="../assets/images/writer/writer-pic-7.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-7.jpg" alt="Pirate Slayer"><div class="gallery-overlay"><span>Pirate Slayer</span></div></a>
          <a href="../assets/images/writer/writer-pic-8.jpg" class="gallery-item" target="_blank"><img src="../assets/images/writer/writer-pic-8.jpg" alt="Unbeatable Combo"><div class="gallery-overlay"><span>Unbeatable Combo</span></div></a>
          <div class="gallery-upload" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-cloud-arrow-up"></i><span>Upload</span></div>
        </div>
      </div>
    </main>
  </div>
  <input type="file" id="fileUpload" style="display:none" accept="image/*" onchange="previewUpload(event)">
  <button class="chat-fab" onclick="toggleChat()"><i class="fas fa-comments"></i></button>
  <div class="chat-window" id="chatContainer">
    <div class="chat-window-header"><span><i class="fas fa-robot" style="margin-right:8px;"></i>AniMaker Chat</span><button onclick="toggleChat()"><i class="fas fa-xmark"></i></button></div>
    <div class="chat-messages" id="chatBox"><div class="chat-empty">No messages yet</div></div>
    <div class="chat-input-area"><input type="text" id="receiver" placeholder="Receiver"><input type="text" id="message" placeholder="Type a message" style="flex:1;"><button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button></div>
  </div>
  <script>
    function toggleChat(){document.getElementById('chatContainer').classList.toggle('active');}
    function sendMessage(){var c=document.getElementById('chatBox'),r=document.getElementById('receiver').value,m=document.getElementById('message').value;if(r&&m){var e=c.querySelector('.chat-empty');if(e)e.remove();var el=document.createElement('div');el.classList.add('chat-msg');el.innerHTML='<div class="chat-msg-sender">You → '+r+'</div>'+m;c.appendChild(el);c.scrollTop=c.scrollHeight;document.getElementById('message').value='';}}
    function previewUpload(ev){var f=ev.target.files[0];if(f){var rd=new FileReader();rd.onload=function(e){var g=document.querySelector('.gallery'),i=document.createElement('a');i.classList.add('gallery-item');i.href=e.target.result;i.target='_blank';i.innerHTML='<img src="'+e.target.result+'" alt="'+f.name+'"><div class="gallery-overlay"><span>'+f.name+'</span></div>';g.insertBefore(i,g.lastElementChild);};rd.readAsDataURL(f);}}
  </script>
</body>
</html>
