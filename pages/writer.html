<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writer — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .auth-loading-overlay { animation: hideOverlay 2s forwards; }
    @keyframes hideOverlay { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

    /* ---- Watermark-style cards (Pinterest masonry) ---- */
    .story-card {
      position: relative;
      margin: 0 0 16px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--bg-tertiary);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      break-inside: avoid;
    }
    .story-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    /* Natural-height image (Pinterest style) */
    .story-card-img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* Dim the image so it reads like a watermark */
    .story-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.4);
      transition: background 0.2s ease;
      z-index: 0;
      pointer-events: none;
    }
    .story-card:hover::before {
      background: rgba(10, 10, 15, 0.2);
    }
    /* Bottom scrim for title readability */
    .story-card-scrim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
      z-index: 1;
      pointer-events: none;
    }
    .story-card.no-cover {
      background: linear-gradient(145deg, var(--bg-elevated), var(--bg-tertiary));
      min-height: 170px;
    }
    .story-card-title {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 56px;
      z-index: 2;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.3;
      text-align: left;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      pointer-events: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .story-card-user {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 4px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
    }
    .story-card-user img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }
    .story-card-owner {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      display: flex;
      gap: 6px;
    }
    .story-card-actions {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .story-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .story-card-action:hover {
      background: var(--accent);
      transform: scale(1.08);
    }
    .story-card-action.liked i { color: #ff4d6d; }
    .story-card-action.saved i { color: var(--accent); }
  </style>
</head>
<body>
  <div class="auth-loading-overlay" id="authLoading"><div class="auth-spinner"></div><p>Verifying your session...</p></div>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="explore.html">Explore</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
                    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-house"></i><span>Home</span></a>
        <a href="explore.html" class="sidebar-link" data-tooltip="Search"><i class="fas fa-magnifying-glass"></i><span>Search</span></a>
        <a href="creator.html" class="sidebar-link" data-tooltip="Creator"><i class="fas fa-images"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link active" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link" data-tooltip="Maker"><i class="fas fa-film"></i><span>Maker</span></a>
        <a href="chat.html" class="sidebar-link" data-tooltip="Messages" style="position:relative;"><i class="fas fa-comment-dots"></i><span>Messages</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <div class="gallery-header-left">
            <h1>Writer Gallery</h1>
          </div>
        </div>

        <div class="gallery-empty" id="galleryEmpty">
          <div class="gallery-empty-icon"><i class="fas fa-pen-nib"></i></div>
          <h3>No stories yet</h3>
          <p>Every great universe starts with a story.</p>
        </div>

        <div class="gallery gallery-masonry" id="writerGallery"></div>
        <div id="galleryLoading" style="text-align:center;padding:60px;"><div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto;"></div></div>
      </div>

    </main>
  </div>

  <div id="editModal" style="display:none;"></div>
  <div id="confirmDialog" style="display:none;"></div>
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/posts.js"></script>
  <script src="../js/social.js"></script>
  <script>
    var currentUserId = null;

    try {
      var authOverlay = document.getElementById('authLoading');
      if (authOverlay) authOverlay.style.display = 'none';
      document.body.classList.add('auth-checked');
    } catch(e) {}
    // Wait for Supabase to be ready before loading gallery
    function tryLoadGallery() {
      if (supabaseClient) {
        loadGallery();
      } else {
        console.log('[Writer] Waiting for Supabase...');
        setTimeout(tryLoadGallery, 100);
      }
    }
    tryLoadGallery();
    try { updateNavbarAuth(); } catch(e) {}
    try { if (typeof renderNotificationBell === 'function') renderNotificationBell(); } catch(e) {}
    try {
      getSession().then(function(session) {
        if (session && session.user) currentUserId = session.user.id;
      }).catch(function() {});
    } catch(e) {}

    function showToast(msg, type) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast ' + (type || 'info');
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    function showConfirm(title, message) {
      return new Promise(function(resolve) {
        var dialog = document.getElementById('confirmDialog');
        dialog.style.display = 'block';
        dialog.innerHTML = '<div class="confirm-overlay" onclick="event.target===this && document.getElementById(\'confirmDialog\').style.display=\'none\'">' +
          '<div class="confirm-box"><h4>' + title + '</h4><p>' + message + '</p>' +
          '<div class="confirm-actions"><button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'confirmDialog\').style.display=\'none\'">Cancel</button><button class="btn btn-primary btn-sm" id="confirmYesBtn">Delete</button></div></div></div>';
        document.getElementById('confirmYesBtn').onclick = function() { dialog.style.display = 'none'; resolve(true); };
      });
    }

    /* ---- Like / Save handlers for story cards ---- */
    async function handleStoryLike(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('liked');
      btn.classList.toggle('liked');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('liked') ? 'fas fa-heart' : 'far fa-heart';
      var countEl = btn.querySelector('.story-like-count');
      var n = parseInt(countEl.textContent) || 0;
      countEl.textContent = btn.classList.contains('liked') ? n + 1 : Math.max(0, n - 1);
      try {
        var nowLiked = await toggleLike(id);
        if (nowLiked && typeof createNotification === 'function') {
          try {
            var c = await fetchCreation(id);
            if (c && c.user_id) {
              var me = await getCurrentProfile();
              var myName = me ? (me.full_name || me.username) : 'Someone';
              await createNotification(c.user_id, 'like', id, null, myName + ' liked your creation');
            }
          } catch (e2) {}
        }
      } catch (e) {
        btn.classList.toggle('liked');
        iconEl.className = prev ? 'fas fa-heart' : 'far fa-heart';
        countEl.textContent = n;
      }
    }

    async function handleStorySave(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('saved');
      btn.classList.toggle('saved');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('saved') ? 'fas fa-bookmark' : 'far fa-bookmark';
      var labelEl = btn.querySelector('.story-save-label');
      if (labelEl) labelEl.textContent = btn.classList.contains('saved') ? 'Saved' : 'Save';
      try {
        await toggleSave(id);
        if (typeof syncSaveButton === 'function') {
          document.querySelectorAll('[data-save-for="' + id + '"]').forEach(function(o) { syncSaveButton(o, btn.classList.contains('saved')); });
        }
      } catch (e) {
        btn.classList.toggle('saved');
        iconEl.className = prev ? 'fas fa-bookmark' : 'far fa-bookmark';
        if (labelEl) labelEl.textContent = prev ? 'Saved' : 'Save';
      }
    }

    /* ---- Hydrate like/save state on visible cards (3 batched queries) ---- */
    async function hydrateStoryCards() {
      var cards = document.querySelectorAll('.story-card[data-creation-id]');
      if (!cards.length) return;

      // Collect card ids
      var ids = [];
      for (var i = 0; i < cards.length; i++) ids.push(cards[i].getAttribute('data-creation-id'));

      // 1) Batch-fetch ALL like counts in ONE query (public read allowed on creation_likes)
      try {
        var { data: likeRows, error: likeErr } = await supabaseClient
          .from('creation_likes')
          .select('creation_id')
          .in('creation_id', ids);
        if (!likeErr && likeRows) {
          var counts = {};
          likeRows.forEach(function(r) { counts[r.creation_id] = (counts[r.creation_id] || 0) + 1; });
          ids.forEach(function(id) {
            var btn = document.querySelector('.story-card[data-creation-id="' + id + '"] .story-card-action.like .story-like-count');
            if (btn) btn.textContent = counts[id] || 0;
          });
        }
      } catch (e1) { /* counts stay at 0 */ }

      // 2) Batch-fetch MY liked + saved state in TWO queries (requires session)
      var session = await getSession();
      if (!session || !session.user) return;

      var likedMap = {}, savedMap = {};
      try {
        likedMap = await getMyLikedCreationIds(ids) || {};
        savedMap = await getSavedCreationIds(ids) || {};
      } catch (e2) { return; }

      ids.forEach(function(id) {
        var card = document.querySelector('.story-card[data-creation-id="' + id + '"]');
        if (!card) return;
        if (likedMap[id]) {
          var lb = card.querySelector('.story-card-action.like');
          if (lb) { lb.classList.add('liked'); var li = lb.querySelector('i'); if (li) li.className = 'fas fa-heart'; }
        }
        if (savedMap[id]) {
          var sb = card.querySelector('.story-card-action.save');
          if (sb) {
            sb.classList.add('saved');
            var si = sb.querySelector('i');
            if (si) si.className = 'fas fa-bookmark';
            var sl = sb.querySelector('.story-save-label');
            if (sl) sl.textContent = 'Saved';
          }
        }
      });
    }

    /* ---- Edit Story Modal ---- */
    function openEditModal(id) {
      fetchCreation(id).then(function(c) {
        if (!c) return;
        var tagsStr = (c.tags || []).join(', ');
        var modal = document.getElementById('editModal');
        modal.style.display = 'block';
        modal.innerHTML = '<div class="upload-modal-overlay" onclick="if(event.target===this)closeEditModal()">' +
          '<div class="upload-modal" onclick="event.stopPropagation()" style="max-width:700px;">' +
            '<div class="upload-modal-header"><h3>Edit Story</h3><button class="upload-modal-close" onclick="closeEditModal()"><i class="fas fa-xmark"></i></button></div>' +
            '<div class="upload-modal-body">' +
              '<div class="form-group"><label>Title *</label><input type="text" id="editTitle" value="' + postEscapeHtml(c.title) + '" maxlength="150"></div>' +
              '<div class="form-group"><label>Summary</label><input type="text" id="editSummary" value="' + postEscapeHtml(c.description || '') + '" maxlength="300"></div>' +
              '<div class="form-group"><label>Genre</label>' +
                '<select id="editGenre">' +
                  '<option value="">Select genre...</option>' +
                  '<option value="Action"' + (c.genre === 'Action' ? ' selected' : '') + '>Action</option>' +
                  '<option value="Adventure"' + (c.genre === 'Adventure' ? ' selected' : '') + '>Adventure</option>' +
                  '<option value="Comedy"' + (c.genre === 'Comedy' ? ' selected' : '') + '>Comedy</option>' +
                  '<option value="Drama"' + (c.genre === 'Drama' ? ' selected' : '') + '>Drama</option>' +
                  '<option value="Fantasy"' + (c.genre === 'Fantasy' ? ' selected' : '') + '>Fantasy</option>' +
                  '<option value="Horror"' + (c.genre === 'Horror' ? ' selected' : '') + '>Horror</option>' +
                  '<option value="Romance"' + (c.genre === 'Romance' ? ' selected' : '') + '>Romance</option>' +
                  '<option value="Sci-Fi"' + (c.genre === 'Sci-Fi' ? ' selected' : '') + '>Sci-Fi</option>' +
                  '<option value="Slice of Life"' + (c.genre === 'Slice of Life' ? ' selected' : '') + '>Slice of Life</option>' +
                  '<option value="Thriller"' + (c.genre === 'Thriller' ? ' selected' : '') + '>Thriller</option>' +
                  '<option value="Fan Fiction"' + (c.genre === 'Fan Fiction' ? ' selected' : '') + '>Fan Fiction</option>' +
                '</select>' +
              '</div>' +
              '<div class="form-group"><label>Tags</label><input type="text" id="editTags" value="' + postEscapeHtml(tagsStr) + '" maxlength="200"></div>' +
              '<div class="form-group"><label>Story Content *</label>' +
                '<textarea class="story-editor-area" id="editStoryContent" maxlength="50000">' + postEscapeHtml(c.story_content || '') + '</textarea>' +
              '</div>' +
            '</div>' +
            '<div class="upload-modal-footer">' +
              '<button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>' +
              '<button class="btn btn-primary" id="saveEditBtn" onclick="handleSaveEdit(\'' + c.id + '\')"><i class="fas fa-check" style="margin-right:6px;"></i>Save</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

    async function handleSaveEdit(id) {
      var btn = document.getElementById('saveEditBtn');
      btn.disabled = true;
      var title = (document.getElementById('editTitle') || {}).value || '';
      var summary = (document.getElementById('editSummary') || {}).value || '';
      var genre = (document.getElementById('editGenre') || {}).value || '';
      var tagsStr = (document.getElementById('editTags') || {}).value || '';
      var storyContent = (document.getElementById('editStoryContent') || {}).value || '';
      if (!title.trim()) { showToast('Title is required.', 'error'); btn.disabled = false; return; }
      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });
      try {
        await updateCreation(id, { title: title.trim(), description: summary.trim(), genre: genre, tags: tags, story_content: storyContent });
        closeEditModal();
        showToast('Story updated!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to update.', 'error');
        btn.disabled = false;
      }
    }

    /* ---- Delete ---- */
    async function handleDelete(id) {
      var confirmed = await showConfirm('Delete Story', 'Are you sure you want to delete this story? This action cannot be undone.');
      if (!confirmed) return;
      try { await deleteCreation(id); showToast('Deleted.', 'success'); var card = document.querySelector('[data-creation-id="' + id + '"]'); if (card) card.remove(); checkEmpty(); }
      catch (err) { showToast(err.message || 'Failed to delete.', 'error'); }
    }

    function checkEmpty() {
      var gallery = document.getElementById('writerGallery');
      var empty = document.getElementById('galleryEmpty');
      var cards = gallery.querySelectorAll('.story-card');
      if (cards.length === 0) empty.classList.add('active'); else empty.classList.remove('active');
    }

    function renderSupabaseCard(c) {
      var profile = getDefaultUser(c) || c.profiles || {};
      var isOwner = currentUserId && c.user_id === currentUserId;
      var card = document.createElement('div');
      card.className = 'story-card' + (c.cover_image_url ? '' : ' no-cover');
      card.setAttribute('data-creation-id', c.id);
      var imgHtml = c.cover_image_url
        ? '<img class="story-card-img" src="' + c.cover_image_url + '" loading="lazy" alt="' + postEscapeHtml(c.title) + '">'
        : '';
      card.onclick = function(e) { if (e.target.closest('.story-card-action') || e.target.closest('.creation-card-action-btn')) return; openStoryDetail(c.id); };
      var ownerHtml = isOwner ? '<div class="story-card-owner">' +
        '<button class="creation-card-action-btn" onclick="event.stopPropagation();openEditModal(\'' + c.id + '\')"><i class="fas fa-pen"></i></button>' +
        '<button class="creation-card-action-btn delete" onclick="event.stopPropagation();handleDelete(\'' + c.id + '\')"><i class="fas fa-trash"></i></button>' +
      '</div>' : '';
      var userName = getCreationUserName(profile);
      var userAvatar = profile.avatar_url
        ? '<img src="' + profile.avatar_url + '" alt="">'
        : '<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">' + userName.charAt(0).toUpperCase() + '</div>';
      card.innerHTML =
        imgHtml +
        '<div class="story-card-scrim"></div>' +
        '<div class="story-card-user">' + userAvatar + '<span>' + postEscapeHtml(userName) + '</span></div>' +
        ownerHtml +
        '<div class="story-card-title">' + postEscapeHtml(c.title) + '</div>' +
        '<div class="story-card-actions">' +
          '<button class="story-card-action like" onclick="event.stopPropagation();handleStoryLike(\'' + c.id + '\', this)"><i class="far fa-heart"></i> <span class="story-like-count">0</span></button>' +
          '<button class="story-card-action" onclick="event.stopPropagation();openStoryDetail(\'' + c.id + '\')"><i class="far fa-comment"></i></button>' +
          '<button class="story-card-action save" data-save-for="' + c.id + '" onclick="event.stopPropagation();handleStorySave(\'' + c.id + '\', this)"><i class="far fa-bookmark"></i> <span class="story-save-label">Save</span></button>' +
        '</div>';
      return card;
    }

    /* ---- One-time cleanup: remove old seeded default stories ----
       Seeded rows can be identified by their local asset cover paths
       (real user uploads always live in Supabase Storage). Safe to run
       on every load; RLS ensures only owned rows are actually removed. */
    async function cleanupSeededStories() {
      if (!supabaseClient) return;
      try {
        await supabaseClient
          .from('creations')
          .delete()
          .eq('type', 'writer')
          .like('cover_image_url', '%assets/images/writer/writer-pic-%');
        // Also catch seeded rows stored without a cover
        await supabaseClient
          .from('creations')
          .delete()
          .eq('type', 'writer')
          .in('title', ['Luffy as Lil Bro of Goku', 'Goats as a Trio', 'Ramen Lovers Together', 'The Last Battle', 'Team Goats', 'Jack Luffy', 'Pirate Slayer', 'Unbeatable Combo'])
          .or('cover_image_url.eq.,cover_image_url.is.null');
      } catch (e) { /* non-fatal */ }
    }

    /* ---- Load Gallery (real stories only — no seeded defaults) ---- */
    async function loadGallery() {
      var container = document.getElementById('writerGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';
      container.innerHTML = '';

      await cleanupSeededStories();

      var creations = [];
      try { creations = await fetchCreations({ limit: 50, type: 'writer' }); } catch(e) { console.error('[Writer] fetch error:', e); }
      loading.style.display = 'none';

      // Hide leftover seeded rows client-side too (RLS can block the delete for
      // anonymous visitors; real user uploads always live in Supabase Storage)
      creations = creations.filter(function(c) {
        var seededCover = c.cover_image_url && c.cover_image_url.indexOf('/storage/') === -1 && c.cover_image_url.indexOf('assets/') !== -1;
        return !seededCover;
      });

      creations.forEach(function(c) { container.appendChild(renderSupabaseCard(c)); });
      checkEmpty();
      hydrateStoryCards();
    }
  </script>
</body>
</html>
