<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writer — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-loading-overlay" id="authLoading"><div class="auth-spinner"></div><p>Verifying your session...</p></div>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link" data-tooltip="Creator"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link active" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link" data-tooltip="Maker"><i class="fas fa-cube"></i><span>Maker</span></a>
        <div class="sidebar-divider"></div>
        <a href="services.html" class="sidebar-link" data-tooltip="Services"><i class="fas fa-th-large"></i><span>Services</span></a>
        <a href="contact.html" class="sidebar-link" data-tooltip="Contact"><i class="fas fa-envelope"></i><span>Contact</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <h1>Writer Gallery</h1>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search stories..." id="searchInput"></div>
        </div>
        <div class="gallery gallery-masonry" id="writerGallery"></div>
        <div id="galleryLoading" style="text-align:center;padding:60px;"><div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto;"></div></div>
      </div>
    </main>
  </div>
  <div id="confirmDialog" style="display:none;"></div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/posts.js"></script>
  <script>
    var defaultStories = [
      { id: 'default-w1', title: 'Luffy as Lil Bro of Goku', cover_image_url: '../assets/images/writer/writer-pic-1.jpg', type: 'writer', profiles: {} },
      { id: 'default-w2', title: 'Goats as a Trio', cover_image_url: '../assets/images/writer/writer-pic-2.jpg', type: 'writer', profiles: {} },
      { id: 'default-w3', title: 'Ramen Lovers Together', cover_image_url: '../assets/images/writer/writer-pic-3.jpg', type: 'writer', profiles: {} },
      { id: 'default-w4', title: 'Story 4', cover_image_url: '../assets/images/writer/writer-pic-4.jpg', type: 'writer', profiles: {} },
      { id: 'default-w5', title: 'Team Goats', cover_image_url: '../assets/images/writer/writer-pic-5.jpg', type: 'writer', profiles: {} },
      { id: 'default-w6', title: 'Jack Luffy', cover_image_url: '../assets/images/writer/writer-pic-6.jpg', type: 'writer', profiles: {} },
      { id: 'default-w7', title: 'Pirate Slayer', cover_image_url: '../assets/images/writer/writer-pic-7.jpg', type: 'writer', profiles: {} },
      { id: 'default-w8', title: 'Unbeatable Combo', cover_image_url: '../assets/images/writer/writer-pic-8.jpg', type: 'writer', profiles: {} }
    ];

    requireAuth().then(async function() { await updateNavbarAuth(); loadGallery(); });

    function openDefaultImage(url, title) {
      var overlay = document.createElement('div');
      overlay.className = 'detail-overlay';
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      overlay.innerHTML = '<button class="detail-close" onclick="this.parentElement.remove()"><i class="fas fa-xmark"></i></button>' +
        '<div style="max-width:90vw;max-height:90vh;display:flex;align-items:center;justify-content:center;">' +
          '<img src="' + url + '" style="max-width:100%;max-height:90vh;object-fit:contain;border-radius:8px;">' +
        '</div>' +
        '<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;font-weight:500;text-shadow:0 2px 8px rgba(0,0,0,0.5);">' + title + '</div>';
      document.body.appendChild(overlay);
    }

    document.getElementById('searchInput').addEventListener('input', function() {
      var q = this.value.toLowerCase();
      document.querySelectorAll('#writerGallery .creation-card, #writerGallery .story-card').forEach(function(card) {
        card.style.display = card.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    });

    async function loadGallery() {
      var container = document.getElementById('writerGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';

      var creations = await fetchCreations({ limit: 50, type: 'writer' });
      loading.style.display = 'none';

      // Render default images first
      defaultStories.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.onclick = function() { openDefaultImage(c.cover_image_url, c.title); };
        card.innerHTML = '<div class="creation-card-image"><img src="' + c.cover_image_url + '" loading="lazy"></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + c.title + '</div>' +
          '</div>';
        container.appendChild(card);
      });

      // Render Supabase creations
      creations.forEach(function(c) {
        var profile = c.profiles || {};
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.setAttribute('data-creation-id', c.id);
        card.onclick = function() { openStoryDetail(c.id); };

        var coverHtml = c.cover_image_url
          ? '<img src="' + c.cover_image_url + '" loading="lazy">'
          : '<div style="display:flex;align-items:center;justify-content:center;background:var(--bg-tertiary);height:200px;"><i class="fas fa-pen-nib" style="font-size:32px;color:var(--text-muted);"></i></div>';

        card.innerHTML = '<div class="creation-card-image">' + coverHtml + '</div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + postEscapeHtml(c.title) + '</div>' +
            '<div class="creation-card-user">' + getCreationUserAvatar(profile, 24) + '<span>' + getCreationUserName(profile) + '</span></div>' +
            '<div class="creation-card-meta"><span>' + timeAgo(c.created_at) + '</span></div>' +
          '</div>';
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
