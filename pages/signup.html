<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="auth-logo">
        <img src="../assets/images/logo.png" alt="AniMaker">
        <span>AniMaker</span>
      </a>
      <h2>Create your account</h2>
      <p class="auth-subtitle">Join the community of creators building the future of anime</p>

      <div id="errorMessage" style="display:none;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:20px;font-size:13px;color:var(--error);"></div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" class="form-input" placeholder="Choose a username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_]+">
          <span class="form-hint">3-30 characters. Letters, numbers, and underscores only.</span>
        </div>
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-input" placeholder="Your name" required maxlength="50">
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="form-input" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-input" placeholder="Confirm your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" id="signupBtn" style="width:100%; margin-top:8px;">
          <span id="signupText"><i class="fas fa-rocket"></i> Create Account</span>
          <span id="signupSpinner" style="display:none;"><div class="loading-spinner" style="width:20px;height:20px;border-width:2px;"></div> Creating...</span>
        </button>
      </form>

      <div class="auth-divider"><span>OR</span></div>

      <button type="button" class="btn-google" id="googleSignupBtn">
        <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Redirect if already logged in
    (async function() {
      if (await isLoggedIn()) {
        window.location.href = '../index.html';
      }
    })();

    const form = document.getElementById('signup-form');
    const errorDiv = document.getElementById('errorMessage');
    const signupBtn = document.getElementById('signupBtn');
    const signupText = document.getElementById('signupText');
    const signupSpinner = document.getElementById('signupSpinner');

    function showError(msg) {
      errorDiv.textContent = msg;
      errorDiv.style.display = 'block';
    }

    function hideError() {
      errorDiv.style.display = 'none';
    }

    function setLoading(loading) {
      signupBtn.disabled = loading;
      signupText.style.display = loading ? 'none' : 'inline';
      signupSpinner.style.display = loading ? 'inline-flex' : 'none';
    }

    // Determine where to go after signup
    var redirectTo = getRedirectUrl();

    // Google OAuth
    var googleSignupBtn = document.getElementById('googleSignupBtn');
    var googleLoading = false;

    if (googleSignupBtn) {
      googleSignupBtn.addEventListener('click', async function() {
        if (!supabaseClient) {
          showError('Google sign-in is not configured. Please add your Supabase credentials in js/supabase.js');
          return;
        }
        if (googleLoading) return;
        googleLoading = true;
        googleSignupBtn.disabled = true;
        googleSignupBtn.innerHTML = '<div class="loading-spinner" style="width:18px;height:18px;border-width:2px;"></div> Connecting to Google...';

        try {
          var redirectTo = window.location.origin + '/index.html';
          var { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: redirectTo }
          });
          if (error) throw error;
        } catch (err) {
          showError(err.message || 'Google sign-in failed. Please try again.');
          googleLoading = false;
          googleSignupBtn.disabled = false;
          googleSignupBtn.innerHTML = '<svg class="google-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg> Continue with Google';
        }
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      var username = document.getElementById('signup-username').value.trim();
      var name = document.getElementById('signup-name').value.trim();
      var email = document.getElementById('signup-email').value.trim();
      var password = document.getElementById('signup-password').value;
      var confirmPassword = document.getElementById('signup-confirm-password').value;

      // Client-side validation
      if (!username || !name || !email || !password || !confirmPassword) {
        showError('Please fill in all fields');
        return;
      }

      if (username.length < 3) {
        showError('Username must be at least 3 characters');
        return;
      }

      if (!/^[a-zA-Z0-9_]+$/.test(username)) {
        showError('Username can only contain letters, numbers, and underscores');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      setLoading(true);

      try {
        if (supabaseClient) {
          var { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                username: username,
                name: name,
                full_name: name
              }
            }
          });
          if (error) throw error;

          // If Supabase requires email confirmation, show a message
          if (data && data.user && data.user.identities && data.user.identities.length === 0) {
            throw new Error('An account with this email already exists');
          }
        } else {
          throw new Error('Authentication service unavailable');
        }

        // Redirect to requested page, or homepage
        if (redirectTo) {
          window.location.href = '../' + redirectTo;
        } else {
          window.location.href = '../index.html';
        }
      } catch (error) {
        showError(error.message || 'Signup failed. Please try again.');
        setLoading(false);
      }
    });
  </script>
</body>
</html>
