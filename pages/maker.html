<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maker — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="user-badge"><div class="user-badge-avatar"><i class="fas fa-user"></i></div> User</div>
    </div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <a href="../index.html" class="sidebar-logo"><img src="../assets/images/logo.png" alt="AniMaker"></a>
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link active"><i class="fas fa-cube"></i><span>Maker</span></a>
        <div class="sidebar-divider"></div>
        <a href="services.html" class="sidebar-link"><i class="fas fa-th-large"></i><span>Services</span></a>
        <a href="contact.html" class="sidebar-link"><i class="fas fa-envelope"></i><span>Contact</span></a>
      </nav>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <h1>Maker Gallery</h1>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search models..."></div>
        </div>
        <div class="gallery">
          <a href="maker-pic-1.html" class="gallery-item"><img src="../assets/images/maker/maker-pic-1.jpg" alt="Maker Creation 1"><div class="gallery-overlay"><span>Maker Creation 1</span></div></a>
          <a href="maker-pic-2.html" class="gallery-item"><img src="../assets/images/maker/maker-pic-2.jpg" alt="Maker Creation 2"><div class="gallery-overlay"><span>Maker Creation 2</span></div></a>
          <div class="gallery-upload" onclick="document.getElementById('fileUpload').click()"><i class="fas fa-cloud-arrow-up"></i><span>Upload</span></div>
        </div>
      </div>
    </main>
  </div>
  <input type="file" id="fileUpload" style="display:none" accept="image/*" onchange="previewUpload(event)">
  <button class="chat-fab" onclick="toggleChat()"><i class="fas fa-comments"></i></button>
  <div class="chat-window" id="chatContainer">
    <div class="chat-window-header"><span><i class="fas fa-robot" style="margin-right:8px;"></i>AniMaker Chat</span><button onclick="toggleChat()"><i class="fas fa-xmark"></i></button></div>
    <div class="chat-messages" id="chatBox"><div class="chat-empty">No messages yet</div></div>
    <div class="chat-input-area"><input type="text" id="receiver" placeholder="Receiver"><input type="text" id="message" placeholder="Type a message" style="flex:1;"><button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button></div>
  </div>
  <script>
    function toggleChat(){document.getElementById('chatContainer').classList.toggle('active');}
    function sendMessage(){const c=document.getElementById('chatBox'),r=document.getElementById('receiver').value,m=document.getElementById('message').value;if(r&&m){const e=c.querySelector('.chat-empty');if(e)e.remove();const el=document.createElement('div');el.classList.add('chat-msg');el.innerHTML='<div class="chat-msg-sender">You → '+r+'</div>'+m;c.appendChild(el);c.scrollTop=c.scrollHeight;document.getElementById('message').value='';}}
    function previewUpload(e){const f=e.target.files[0];if(f){const r=new FileReader();r.onload=function(ev){const g=document.querySelector('.gallery'),i=document.createElement('a');i.classList.add('gallery-item');i.href=ev.target.result;i.target='_blank';i.innerHTML='<img src="'+ev.target.result+'" alt="'+f.name+'"><div class="gallery-overlay"><span>'+f.name+'</span></div>';g.insertBefore(i,g.lastElementChild);};r.readAsDataURL(f);}}
  </script>
</body>
</html>
