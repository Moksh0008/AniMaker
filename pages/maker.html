<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maker — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-loading-overlay" id="authLoading"><div class="auth-spinner"></div><p>Verifying your session...</p></div>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link" data-tooltip="Creator"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link active" data-tooltip="Maker"><i class="fas fa-cube"></i><span>Maker</span></a>

      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <h1>Maker Gallery</h1>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search animations..." id="searchInput"></div>
        </div>
        <div class="gallery gallery-masonry" id="makerGallery"></div>
        <div id="galleryLoading" style="text-align:center;padding:60px;"><div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto;"></div></div>
      </div>
    </main>
  </div>
  <div class="video-modal-overlay" id="videoModal" style="display:none;" onclick="closeVideoModal(event)">
    <button class="video-modal-close" onclick="closeVideoModal(event)"><i class="fas fa-xmark"></i></button>
    <video id="modalVideo" controls></video>
  </div>
  <div id="confirmDialog" style="display:none;"></div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/posts.js"></script>
  <script>
    var defaultVideos = [
      { id: 'default-m1', title: 'Animation 1', cover_image_url: '../assets/images/maker/maker-pic-1.jpg', video_url: '../assets/videos/animation-1.mp4', type: 'maker', profiles: {} },
      { id: 'default-m2', title: 'Animation 2', cover_image_url: '../assets/images/maker/maker-pic-2.jpg', video_url: '../assets/videos/animation-2.mp4', type: 'maker', profiles: {} },
      { id: 'default-m3', title: 'Animation 3', cover_image_url: '../assets/images/maker/maker-pic-3.jpg', video_url: '../assets/videos/animation-3.mp4', type: 'maker', profiles: {} },
      { id: 'default-m4', title: 'Animation 4', cover_image_url: '../assets/images/maker/maker-pic-4.jpg', video_url: '../assets/videos/animation-4.mp4', type: 'maker', profiles: {} },
      { id: 'default-m5', title: 'Animation 5', cover_image_url: '../assets/images/maker/maker-pic-5.jpg', video_url: '../assets/videos/animation-5.mp4', type: 'maker', profiles: {} },
      { id: 'default-m6', title: 'Animation 6', cover_image_url: '../assets/images/maker/maker-pic-6.jpg', video_url: '../assets/videos/animation-6.mp4', type: 'maker', profiles: {} },
      { id: 'default-m7', title: 'Animation 7', cover_image_url: '../assets/images/maker/maker-pic-7.jpg', video_url: '../assets/videos/animation-7.mp4', type: 'maker', profiles: {} },
      { id: 'default-m8', title: 'Animation 8', cover_image_url: '../assets/images/maker/maker-pic-8.jpg', video_url: '../assets/videos/animation-8.mp4', type: 'maker', profiles: {} },
      { id: 'default-m9', title: 'Animation 9', cover_image_url: '../assets/images/maker/maker-pic-9.jpg', video_url: '../assets/videos/animation-9.mp4', type: 'maker', profiles: {} }
    ];

    requireAuth().then(async function() { await updateNavbarAuth(); loadGallery(); });

    document.getElementById('searchInput').addEventListener('input', function() {
      var q = this.value.toLowerCase();
      document.querySelectorAll('#makerGallery .creation-card').forEach(function(card) {
        card.style.display = card.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    });

    function openVideoModal(src) {
      var m = document.getElementById('videoModal');
      var v = document.getElementById('modalVideo');
      v.src = src;
      m.style.display = 'flex';
      v.play();
    }

    function closeVideoModal(e) {
      if (e.target === document.getElementById('videoModal') || e.currentTarget.classList.contains('video-modal-close')) {
        var m = document.getElementById('videoModal');
        var v = document.getElementById('modalVideo');
        v.pause();
        v.src = '';
        m.style.display = 'none';
      }
    }

    async function loadGallery() {
      var container = document.getElementById('makerGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';

      var creations = await fetchCreations({ limit: 50, type: 'maker' });
      loading.style.display = 'none';

      // Render default videos first
      defaultVideos.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.onclick = function() { openVideoModal(c.video_url); };
        card.innerHTML = '<div class="creation-card-image"><img src="' + c.cover_image_url + '" loading="lazy"><div class="play-overlay"><i class="fas fa-play"></i></div></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + c.title + '</div>' +
          '</div>';
        container.appendChild(card);
      });

      // Render Supabase creations
      creations.forEach(function(c) {
        var profile = c.profiles || {};
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.setAttribute('data-creation-id', c.id);
        card.onclick = function() { openMakerDetail(c.id); };

        var thumb = c.cover_image_url || c.media_url;
        card.innerHTML = '<div class="creation-card-image"><img src="' + thumb + '" loading="lazy"><div class="play-overlay"><i class="fas fa-play"></i></div></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + postEscapeHtml(c.title) + '</div>' +
            '<div class="creation-card-user">' + getCreationUserAvatar(profile, 24) + '<span>' + getCreationUserName(profile) + '</span></div>' +
            '<div class="creation-card-meta"><span>' + timeAgo(c.created_at) + '</span></div>' +
          '</div>';
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
