<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .creator-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.2s ease;
    }
    .creator-popup {
      display: flex;
      width: 90%;
      max-width: 900px;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(124, 92, 252, 0.4);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 24px rgba(124, 92, 252, 0.15);
    }
    .creator-popup-image {
      flex: 0 0 40%;
      max-width: 40%;
      overflow: hidden;
    }
    .creator-popup-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .creator-popup-info {
      flex: 0 0 60%;
      max-width: 60%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .creator-popup-info h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 20px;
      color: #fff;
    }
    .creator-popup-info ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .creator-popup-info ul li {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      margin-bottom: 14px;
      padding-left: 20px;
      position: relative;
    }
    .creator-popup-info ul li::before {
      content: '\2726';
      position: absolute;
      left: 0;
      color: #8b5cf6;
      font-size: 12px;
    }
    .creator-popup-info ul li strong { color: #fff; }
    .creator-popup-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5001;
      transition: background 0.15s ease;
    }
    .creator-popup-close:hover { background: rgba(255, 255, 255, 0.2); }
    @media (max-width: 700px) {
      .creator-popup { flex-direction: column; }
      .creator-popup-image, .creator-popup-info { flex: none; max-width: 100%; }
      .creator-popup-image { max-height: 280px; }
    }
    /* Failsafe: auto-hide auth overlay after 2 seconds even if JS fails */
    .auth-loading-overlay { animation: hideOverlay 2s forwards; }
    @keyframes hideOverlay { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }
  </style>
</head>
<body>
  <div class="auth-loading-overlay" id="authLoading"><div class="auth-spinner"></div><p>Verifying your session...</p></div>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link active" data-tooltip="Creator"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link" data-tooltip="Maker"><i class="fas fa-cube"></i><span>Maker</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <div class="gallery-header-left">
            <h1>Creator Gallery</h1>
            <button class="btn-create" onclick="openCreateModal()"><i class="fas fa-plus"></i> Create Creation</button>
          </div>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search creations..." id="searchInput"></div>
        </div>

        <!-- Empty State -->
        <div class="gallery-empty" id="galleryEmpty">
          <div class="gallery-empty-icon"><i class="fas fa-image"></i></div>
          <h3>No creations yet</h3>
          <p>Share your imagination with the AniMaker community.</p>
          <button class="btn-create" onclick="openCreateModal()"><i class="fas fa-plus"></i> Create Creation</button>
        </div>

        <!-- Gallery Grid -->
        <div class="gallery gallery-masonry" id="creatorGallery"></div>

        <!-- Loading -->
        <div id="galleryLoading" style="text-align:center;padding:60px;"><div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto;"></div></div>
      </div>

    </main>
  </div>

  <!-- Upload Modal -->
  <div id="uploadModal" style="display:none;"></div>
  <!-- Edit Modal -->
  <div id="editModal" style="display:none;"></div>
  <!-- Confirm Dialog -->
  <div id="confirmDialog" style="display:none;"></div>
  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/posts.js"></script>
  <script>
    var defaultCreations = [
      { id: 'default-1', title: 'A Fusion of Naruto and Goku', cover_image_url: '../assets/images/creator/creator-pic-1.jpg', points: ['A fusion of <strong>Naruto</strong> and <strong>Goku</strong>.', 'Combines Naruto\'s fiery determination.', 'Merges with <strong>Goku\'s</strong> raw Saiyan power.', 'Represents a tribute to two anime legends.'] },
      { id: 'default-2', title: 'Super Saiyan Nine Tails', cover_image_url: '../assets/images/creator/creator-pic-2.jpg', points: ['A fusion of <strong>Super Saiyan</strong> and <strong>Nine-Tails</strong>.', 'Combines Saiyan transformations with Kurama\'s chakra.', 'Unmatched power in a single form.', 'A tribute to two iconic transformations.'] },
      { id: 'default-3', title: 'Gear 5 Goku', cover_image_url: '../assets/images/creator/creator-pic-3.jpg', points: ['<strong>Goku</strong> reaches his ultimate form with Gear 5.', 'Unlocks the power of <strong>Nika</strong>, the Sun God.', 'Reality-bending abilities and cartoon-like powers.', 'The peak of Saiyan transformation.'] },
      { id: 'default-4', title: 'Ichigo Naruto', cover_image_url: '../assets/images/creator/creator-pic-4.jpg', points: ['A fusion of <strong>Ichigo</strong> and <strong>Naruto</strong>.', 'Combines Hollow powers with Nine-Tails chakra.', 'Wields both Zangetsu and Rasengan.', 'A warrior from two worlds.'] },
      { id: 'default-5', title: 'Creation 5', cover_image_url: '../assets/images/creator/creator-pic-5.jpg', points: ['An original <strong>anime character design</strong>.', 'Inspired by popular shonen anime art styles.', 'Features unique color palette and dynamic posing.', 'A tribute to the anime community.'] },
      { id: 'default-6', title: 'Vegetto', cover_image_url: '../assets/images/creator/creator-pic-6.jpg', points: ['The fusion of <strong>Vegeta</strong> and <strong>Goku</strong>.', 'Wears the iconic <strong>Potara earrings</strong>.', 'Combines Saiyan pride with warrior instinct.', 'One of the most powerful warriors.'] },
      { id: 'default-7', title: 'Gear 5 Baryon', cover_image_url: '../assets/images/creator/creator-pic-7.jpg', points: ['A fusion of <strong>Gear 5</strong> and <strong>Baryon Mode</strong>.', 'Combines the power of the <strong>Sun God Nika</strong>.', 'Merges with <strong>Nine-Tails</strong> chakra form.', 'The ultimate transformation.'] },
      { id: 'default-8', title: 'Lugoto', cover_image_url: '../assets/images/creator/creator-pic-8.jpg', points: ['A creative fusion of <strong>Luffy</strong> and <strong>Goku</strong>.', 'Combines pirate spirit with Saiyan strength.', 'Features unique <strong>rubber-like</strong> abilities.', 'A tribute to One Piece and Dragon Ball.'] }
    ];

    var currentUserId = null;

    // Hide auth overlay immediately
    try {
      var authOverlay = document.getElementById('authLoading');
      if (authOverlay) authOverlay.style.display = 'none';
      document.body.classList.add('auth-checked');
    } catch(e) {}

    try { loadGallery(); } catch(e) { console.error('[Creator] loadGallery error:', e); }
    try { updateNavbarAuth(); } catch(e) {}
    try {
      getSession().then(function(session) {
        if (session && session.user) currentUserId = session.user.id;
      }).catch(function() {});
    } catch(e) {}

    /* ---- Toast ---- */
    function showToast(msg, type) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast ' + (type || 'info');
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(function() { toast.remove(); }, 3000);
    }

    /* ---- Confirm Dialog ---- */
    function showConfirm(title, message) {
      return new Promise(function(resolve) {
        var dialog = document.getElementById('confirmDialog');
        dialog.style.display = 'block';
        dialog.innerHTML = '<div class="confirm-overlay" onclick="event.target===this && document.getElementById(\'confirmDialog\').style.display=\'none\'">' +
          '<div class="confirm-box">' +
            '<h4>' + title + '</h4>' +
            '<p>' + message + '</p>' +
            '<div class="confirm-actions">' +
              '<button class="btn btn-secondary btn-sm" onclick="document.getElementById(\'confirmDialog\').style.display=\'none\'">Cancel</button>' +
              '<button class="btn btn-primary btn-sm" id="confirmYesBtn">Delete</button>' +
            '</div>' +
          '</div>' +
        '</div>';
        document.getElementById('confirmYesBtn').onclick = function() {
          dialog.style.display = 'none';
          resolve(true);
        };
      });
    }

    /* ---- Default image popup ---- */
    function openCreatorPopup(url, title, points, userName, userAvatar, timeAgo) {
      userName = userName || 'Anonymous';
      timeAgo = timeAgo || 'just now';
      var pointsHtml = points && points.length ? '<ul>' + points.map(function(p) { return '<li>' + p + '</li>'; }).join('') + '</ul>' : '';
      var avatarHtml = userAvatar
        ? '<img src="' + userAvatar + '" alt="' + userName + '" style="width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;">'
        : '<div style="width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0;">' + userName.charAt(0).toUpperCase() + '</div>';
      var overlay = document.createElement('div');
      overlay.className = 'creator-popup-overlay';
      overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
      overlay.innerHTML = '<button class="creator-popup-close" onclick="this.parentElement.remove()"><i class="fas fa-xmark"></i></button>' +
        '<div class="creator-popup">' +
          '<div class="creator-popup-image"><img src="' + url + '" alt="' + title + '"></div>' +
          '<div class="creator-popup-info">' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;">' +
              avatarHtml +
              '<div><div style="color:#fff;font-weight:600;font-size:15px;">' + userName + '</div><div style="color:var(--accent);font-size:13px;">Creator</div></div>' +
            '</div>' +
            '<h1>' + title + '</h1>' +
            pointsHtml +
            '<div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);">' + timeAgo + '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    /* ---- Upload Modal ---- */
    var _uploadFile = null;

    function openCreateModal() {
      _uploadFile = null;
      var modal = document.getElementById('uploadModal');
      modal.style.display = 'block';
      modal.innerHTML = '<div class="upload-modal-overlay" onclick="if(event.target===this)closeCreateModal()">' +
        '<div class="upload-modal" onclick="event.stopPropagation()">' +
          '<div class="upload-modal-header"><h3>Create Creation</h3><button class="upload-modal-close" onclick="closeCreateModal()"><i class="fas fa-xmark"></i></button></div>' +
          '<div class="upload-modal-body">' +
            '<div class="upload-progress" id="uploadProgress"><div class="upload-progress-bar-bg"><div class="upload-progress-bar" id="uploadProgressBar"></div></div><div class="upload-progress-text" id="uploadProgressText">Uploading...</div></div>' +
            '<div class="upload-dropzone" id="dropzone">' +
              '<div class="upload-dropzone-icon"><i class="fas fa-cloud-arrow-up"></i></div>' +
              '<h4>Upload your image</h4>' +
              '<p>JPG, PNG, GIF, WEBP — Max 10MB</p>' +
            '</div>' +
            '<div class="upload-preview" id="mediaPreview"></div>' +
            '<input type="file" id="fileInput" style="display:none" accept="image/jpeg,image/png,image/webp,image/gif">' +
            '<div class="form-group"><label>Title *</label><input type="text" id="uploadTitle" placeholder="Give your creation a name" maxlength="100"></div>' +
            '<div class="form-group"><label>Description *</label><textarea id="uploadDesc" placeholder="Describe your creation in detail..." maxlength="2000" rows="4"></textarea></div>' +
            '<div class="form-group"><label>Tags (comma separated)</label><input type="text" id="uploadTags" placeholder="anime, fusion, dragon ball" maxlength="200"></div>' +
          '</div>' +
          '<div class="upload-modal-footer">' +
            '<button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>' +
            '<button class="btn btn-primary" id="publishBtn" onclick="handlePublish()" disabled><i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish</button>' +
          '</div>' +
        '</div>' +
      '</div>';

      setupDropzone('dropzone', 'fileInput', 'mediaPreview');
    }

    function closeCreateModal() {
      document.getElementById('uploadModal').style.display = 'none';
      _uploadFile = null;
    }

    function setupDropzone(dzId, fiId, previewId) {
      var dz = document.getElementById(dzId);
      var fi = document.getElementById(fiId);
      if (!dz || !fi) return;
      dz.addEventListener('click', function() { fi.click(); });
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragover'); });
      dz.addEventListener('dragleave', function() { dz.classList.remove('dragover'); });
      dz.addEventListener('drop', function(e) { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files[0]); });
      fi.addEventListener('change', function(e) { if (e.target.files[0]) handleFileSelect(e.target.files[0]); });
    }

    function handleFileSelect(file) {
      if (!VALID_IMAGE_TYPES.includes(file.type)) { showToast('Please select a JPG, PNG, GIF, or WEBP image.', 'error'); return; }
      if (file.size > MAX_IMAGE_SIZE) { showToast('Image must be less than 10MB.', 'error'); return; }
      _uploadFile = file;
      var preview = document.getElementById('mediaPreview');
      var dz = document.getElementById('dropzone');
      var reader = new FileReader();
      reader.onload = function(e) {
        preview.innerHTML = '<img src="' + e.target.result + '"><button class="upload-preview-remove" onclick="removeUploadFile()"><i class="fas fa-xmark"></i></button>';
        preview.classList.add('active');
        if (dz) dz.style.display = 'none';
        document.getElementById('publishBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function removeUploadFile() {
      _uploadFile = null;
      var preview = document.getElementById('mediaPreview');
      preview.classList.remove('active');
      preview.innerHTML = '';
      var dz = document.getElementById('dropzone');
      if (dz) dz.style.display = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('publishBtn').disabled = true;
    }

    async function handlePublish() {
      var btn = document.getElementById('publishBtn');
      if (!btn || btn.disabled || !_uploadFile) return;
      var title = (document.getElementById('uploadTitle') || {}).value || '';
      var desc = (document.getElementById('uploadDesc') || {}).value || '';
      var tagsStr = (document.getElementById('uploadTags') || {}).value || '';
      if (!title.trim()) { showToast('Please enter a title.', 'error'); return; }
      if (!desc.trim()) { showToast('Please add a description.', 'error'); return; }

      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });

      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div> Publishing...';
      document.getElementById('uploadProgress').classList.add('active');

      try {
        var result = await uploadCreationFile(_uploadFile, 'uploads', function(pct) {
          document.getElementById('uploadProgressBar').style.width = pct + '%';
          document.getElementById('uploadProgressText').textContent = pct < 100 ? 'Uploading... ' + pct + '%' : 'Processing...';
        });

        await createCreation({
          type: 'creator',
          title: title.trim(),
          description: desc.trim(),
          tags: tags,
          cover_image_url: result.url
        });

        closeCreateModal();
        showToast('Creation published!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to publish.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish';
        document.getElementById('uploadProgress').classList.remove('active');
      }
    }

    /* ---- Edit Modal ---- */
    function openEditModal(id) {
      fetchCreation(id).then(function(c) {
        if (!c) return;
        var tagsStr = (c.tags || []).join(', ');
        var modal = document.getElementById('editModal');
        modal.style.display = 'block';
        modal.innerHTML = '<div class="upload-modal-overlay" onclick="if(event.target===this)closeEditModal()">' +
          '<div class="upload-modal" onclick="event.stopPropagation()">' +
            '<div class="upload-modal-header"><h3>Edit Creation</h3><button class="upload-modal-close" onclick="closeEditModal()"><i class="fas fa-xmark"></i></button></div>' +
            '<div class="upload-modal-body">' +
              '<div class="form-group"><label>Title *</label><input type="text" id="editTitle" value="' + postEscapeHtml(c.title) + '" maxlength="100"></div>' +
              '<div class="form-group"><label>Description *</label><textarea id="editDesc" rows="4" maxlength="2000">' + postEscapeHtml(c.description || '') + '</textarea></div>' +
              '<div class="form-group"><label>Tags (comma separated)</label><input type="text" id="editTags" value="' + postEscapeHtml(tagsStr) + '" maxlength="200"></div>' +
            '</div>' +
            '<div class="upload-modal-footer">' +
              '<button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>' +
              '<button class="btn btn-primary" id="saveEditBtn" onclick="handleSaveEdit(\'' + c.id + '\')"><i class="fas fa-check" style="margin-right:6px;"></i>Save</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function handleSaveEdit(id) {
      var btn = document.getElementById('saveEditBtn');
      btn.disabled = true;
      var title = (document.getElementById('editTitle') || {}).value || '';
      var desc = (document.getElementById('editDesc') || {}).value || '';
      var tagsStr = (document.getElementById('editTags') || {}).value || '';
      if (!title.trim()) { showToast('Title is required.', 'error'); btn.disabled = false; return; }
      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });
      try {
        await updateCreation(id, { title: title.trim(), description: desc.trim(), tags: tags });
        closeEditModal();
        showToast('Updated!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to update.', 'error');
        btn.disabled = false;
      }
    }

    /* ---- Delete ---- */
    async function handleDelete(id) {
      var confirmed = await showConfirm('Delete Creation', 'Are you sure you want to delete this? This action cannot be undone.');
      if (!confirmed) return;
      try {
        await deleteCreation(id);
        showToast('Deleted.', 'success');
        var card = document.querySelector('[data-creation-id="' + id + '"]');
        if (card) card.remove();
        checkEmpty();
      } catch (err) {
        showToast(err.message || 'Failed to delete.', 'error');
      }
    }

    function checkEmpty() {
      var gallery = document.getElementById('creatorGallery');
      var empty = document.getElementById('galleryEmpty');
      var cards = gallery.querySelectorAll('.creation-card');
      if (cards.length === 0) empty.classList.add('active');
      else empty.classList.remove('active');
    }

    /* ---- Search ---- */
    var searchTimeout = null;
    document.getElementById('searchInput').addEventListener('input', function() {
      var q = this.value;
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(async function() {
        var gallery = document.getElementById('creatorGallery');
        gallery.querySelectorAll('[data-creation-id]').forEach(function(c) { c.remove(); });
        var results = [];
        try { results = q.trim() ? await searchCreations(q, 'creator') : await fetchCreations({ limit: 50, type: 'creator' }); } catch(e) {}
        results.forEach(function(c) { gallery.appendChild(renderSupabaseCard(c)); });
        checkEmpty();
      }, 300);
    });

    function renderSupabaseCard(c) {
      var profile = c.profiles || {};
      var isOwner = currentUserId && c.user_id === currentUserId;
      var card = document.createElement('div');
      card.className = 'creation-card';
      card.setAttribute('data-creation-id', c.id);
      card.onclick = function(e) {
        if (e.target.closest('.creation-card-action-btn')) return;
        openCreatorDetail(c.id);
      };
      var actionsHtml = isOwner ? '<div class="creation-card-actions">' +
        '<button class="creation-card-action-btn" onclick="event.stopPropagation();openEditModal(\'' + c.id + '\')"><i class="fas fa-pen"></i></button>' +
        '<button class="creation-card-action-btn delete" onclick="event.stopPropagation();handleDelete(\'' + c.id + '\')"><i class="fas fa-trash"></i></button>' +
      '</div>' : '';
      card.innerHTML = '<div class="creation-card-image"><img src="' + (c.cover_image_url || '') + '" loading="lazy">' + actionsHtml + '</div>' +
        '<div class="creation-card-body">' +
          '<div class="creation-card-title">' + postEscapeHtml(c.title) + '</div>' +
          '<div class="creation-card-user">' + getCreationUserAvatar(profile, 24) + '<span>' + getCreationUserName(profile) + '</span></div>' +
          '<div class="creation-card-meta"><span>' + timeAgo(c.created_at) + '</span></div>' +
        '</div>';
      return card;
    }

    /* ---- Load Gallery ---- */
    async function loadGallery() {
      var container = document.getElementById('creatorGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';
      container.innerHTML = '';

      var creations = [];
      try { creations = await fetchCreations({ limit: 50, type: 'creator' }); } catch(e) { console.error('[Creator] fetch error:', e); }
      loading.style.display = 'none';

      var randomUsers = [
        { name: 'AkiraSensei', initial: 'A', avatar: '../assets/images/avatars/avatar-1.jpg' },
        { name: 'NarutoFan99', initial: 'N', avatar: '../assets/images/avatars/avatar-2.jpg' },
        { name: 'SaiyanArtist', initial: 'S', avatar: '../assets/images/avatars/avatar-3.jpg' },
        { name: 'LuffyLover', initial: 'L', avatar: '../assets/images/avatars/avatar-4.jpg' },
        { name: 'IchigoInk', initial: 'I', avatar: '../assets/images/avatars/avatar-5.jpg' },
        { name: 'ZoroDraws', initial: 'Z', avatar: '../assets/images/avatars/avatar-6.jpg' },
        { name: 'Gear5Creator', initial: 'G', avatar: '../assets/images/avatars/avatar-7.jpg' },
        { name: 'AkatsukiArt', initial: 'A', avatar: '../assets/images/avatars/avatar-8.jpg' }
      ];
      var randomDates = ['2h ago', '5h ago', '1d ago', '3d ago', '5d ago', '1w ago', '2w ago', '1mo ago'];

      defaultCreations.forEach(function(c, i) {
        var user = randomUsers[i % randomUsers.length];
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.onclick = function(u, a, t) { return function() { openCreatorPopup(c.cover_image_url, c.title, c.points, u, a, t); }; }(user.name, user.avatar, randomDates[i % randomDates.length]);
        card.innerHTML = '<div class="creation-card-image"><img src="' + c.cover_image_url + '" loading="lazy"></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + c.title + '</div>' +
            '<div class="creation-card-user">' +
              '<img src="' + user.avatar + '" alt="' + user.name + '" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">' +
              '<span>' + user.name + '</span>' +
            '</div>' +
            '<div class="creation-card-meta"><span>' + randomDates[i % randomDates.length] + '</span></div>' +
          '</div>';
        container.appendChild(card);
      });

      creations.forEach(function(c) { container.appendChild(renderSupabaseCard(c)); });

      checkEmpty();
    }
  </script>
</body>
</html>
