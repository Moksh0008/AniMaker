<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator — AniMaker</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-loading-overlay" id="authLoading"><div class="auth-spinner"></div><p>Verifying your session...</p></div>
  <nav class="navbar">
    <a href="../index.html" class="logo"><img src="../assets/images/logo.png" alt="AniMaker"> AniMaker</a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div class="nav-actions" style="position:relative;"></div>
    <div class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('active')"><span></span><span></span><span></span></div>
  </nav>
  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <a href="../index.html" class="sidebar-link" data-tooltip="Home"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="creator.html" class="sidebar-link active" data-tooltip="Creator"><i class="fas fa-film"></i><span>Creator</span></a>
        <a href="writer.html" class="sidebar-link" data-tooltip="Writer"><i class="fas fa-pen-nib"></i><span>Writer</span></a>
        <a href="maker.html" class="sidebar-link" data-tooltip="Maker"><i class="fas fa-cube"></i><span>Maker</span></a>
        <div class="sidebar-divider"></div>
        <a href="services.html" class="sidebar-link" data-tooltip="Services"><i class="fas fa-th-large"></i><span>Services</span></a>
        <a href="contact.html" class="sidebar-link" data-tooltip="Contact"><i class="fas fa-envelope"></i><span>Contact</span></a>
      </nav>
      <div class="sidebar-bottom">
        <a href="javascript:void(0)" class="sidebar-link" data-tooltip="Settings" onclick="openSettings()"><i class="fas fa-gear"></i><span>Settings</span></a>
      </div>
    </aside>
    <main class="main-content">
      <div class="page-container">
        <div class="gallery-header">
          <h1>Creator Gallery</h1>
          <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search creations..." id="searchInput"></div>
        </div>
        <div class="gallery gallery-masonry" id="creatorGallery"></div>
        <div id="galleryLoading" style="text-align:center;padding:60px;"><div class="loading-spinner" style="width:32px;height:32px;border-width:2px;margin:0 auto;"></div></div>
      </div>
    </main>
  </div>
  <div id="confirmDialog" style="display:none;"></div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/posts.js"></script>
  <script>
    var defaultCreations = [
      { id: 'default-1', title: 'A Fusion of Naruto and Goku', cover_image_url: '../assets/images/creator/creator-pic-1.jpg', type: 'creator', profiles: {} },
      { id: 'default-2', title: 'Super Saiyan Nine Tails', cover_image_url: '../assets/images/creator/creator-pic-2.jpg', type: 'creator', profiles: {} },
      { id: 'default-3', title: 'Gear 5 Goku', cover_image_url: '../assets/images/creator/creator-pic-3.jpg', type: 'creator', profiles: {} },
      { id: 'default-4', title: 'Ichigo Naruto', cover_image_url: '../assets/images/creator/creator-pic-4.jpg', type: 'creator', profiles: {} },
      { id: 'default-5', title: 'Creation 5', cover_image_url: '../assets/images/creator/creator-pic-5.jpg', type: 'creator', profiles: {} },
      { id: 'default-6', title: 'Vegetto', cover_image_url: '../assets/images/creator/creator-pic-6.jpg', type: 'creator', profiles: {} },
      { id: 'default-7', title: 'Gear 5 Baryon', cover_image_url: '../assets/images/creator/creator-pic-7.jpg', type: 'creator', profiles: {} },
      { id: 'default-8', title: 'Lugoto', cover_image_url: '../assets/images/creator/creator-pic-8.jpg', type: 'creator', profiles: {} }
    ];

    requireAuth().then(async function() { await updateNavbarAuth(); loadGallery(); });

    document.getElementById('searchInput').addEventListener('input', function() {
      var q = this.value.toLowerCase();
      document.querySelectorAll('#creatorGallery .creation-card').forEach(function(card) {
        card.style.display = card.textContent.toLowerCase().indexOf(q) !== -1 ? '' : 'none';
      });
    });

    async function loadGallery() {
      var container = document.getElementById('creatorGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';

      // Load user creations from Supabase
      var creations = await fetchCreations({ limit: 50, type: 'creator' });
      loading.style.display = 'none';

      // Render default images first
      defaultCreations.forEach(function(c) {
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.innerHTML = '<div class="creation-card-image"><img src="' + c.cover_image_url + '" loading="lazy"></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + c.title + '</div>' +
          '</div>';
        container.appendChild(card);
      });

      // Render Supabase creations
      creations.forEach(function(c) {
        var profile = c.profiles || {};
        var card = document.createElement('div');
        card.className = 'creation-card';
        card.setAttribute('data-creation-id', c.id);
        card.onclick = function() { openCreatorDetail(c.id); };
        card.innerHTML = '<div class="creation-card-image"><img src="' + (c.cover_image_url || '') + '" loading="lazy"></div>' +
          '<div class="creation-card-body">' +
            '<div class="creation-card-title">' + postEscapeHtml(c.title) + '</div>' +
            '<div class="creation-card-user">' + getCreationUserAvatar(profile, 24) + '<span>' + getCreationUserName(profile) + '</span></div>' +
            '<div class="creation-card-meta"><span>' + timeAgo(c.created_at) + '</span></div>' +
          '</div>';
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
