  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .creator-popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: fadeIn 0.2s ease;
    }
    .creator-popup {
      display: flex;
      width: 90%;
      max-width: 900px;
      background: rgba(255,255,255,0.04);
      border: 2px solid rgba(124, 92, 252, 0.4);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 24px rgba(124, 92, 252, 0.15);
    }
    .creator-popup-image {
      flex: 0 0 40%;
      max-width: 40%;
      overflow: hidden;
    }
    .creator-popup-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .creator-popup-info {
      flex: 0 0 60%;
      max-width: 60%;
      padding: 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .creator-popup-info h1 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 20px;
      color: #fff;
    }
    .creator-popup-info ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .creator-popup-info ul li {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      line-height: 1.7;
      margin-bottom: 14px;
      padding-left: 20px;
      position: relative;
    }
    .creator-popup-info ul li::before {
      content: '\2726';
      position: absolute;
      left: 0;
      color: #8b5cf6;
      font-size: 12px;
    }
    .creator-popup-info ul li strong { color: #fff; }
    .creator-popup-close {
      position: fixed;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5001;
      transition: background 0.15s ease;
    }
    .creator-popup-close:hover { background: rgba(255, 255, 255, 0.2); }
    @media (max-width: 700px) {
      .creator-popup { flex-direction: column; }
      .creator-popup-image, .creator-popup-info { flex: none; max-width: 100%; }
      .creator-popup-image { max-height: 280px; }
    }
    /* Failsafe: auto-hide auth overlay after 2 seconds even if JS fails */
    .auth-loading-overlay { animation: hideOverlay 2s forwards; }
    @keyframes hideOverlay { from { opacity: 1; } to { opacity: 0; pointer-events: none; } }

    /* ---- Watermark-style cards (Pinterest masonry) ---- */
    .story-card {
      position: relative;
      margin: 0 0 16px;
      border-radius: var(--radius-md);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      background: var(--bg-tertiary);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      break-inside: avoid;
    }
    .story-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }
    /* Natural-height image (Pinterest style) */
    .story-card-img {
      display: block;
      width: 100%;
      height: auto;
    }
    /* Dim the image so it reads like a watermark */
    .story-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 15, 0.4);
      transition: background 0.2s ease;
      z-index: 0;
      pointer-events: none;
    }
    .story-card:hover::before {
      background: rgba(10, 10, 15, 0.2);
    }
    /* Bottom scrim for title readability */
    .story-card-scrim {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
      z-index: 1;
      pointer-events: none;
    }
    .story-card.no-cover {
      background: linear-gradient(145deg, var(--bg-elevated), var(--bg-tertiary));
      min-height: 170px;
    }
    .story-card-title {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 56px;
      z-index: 2;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      line-height: 1.35;
      text-align: left;
      text-shadow: 0 2px 10px rgba(0,0,0,0.95);
      pointer-events: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .story-card-user {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px 3px 4px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
    }
    .story-card-user img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }
    .story-card-owner {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      display: flex;
      gap: 6px;
    }
    .story-card-actions {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 3;
      display: flex;
      gap: 8px;
    }
    .story-card-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .story-card-action:hover {
      background: var(--accent);
      transform: scale(1.08);
    }
    .story-card-action.liked i { color: #ff4d6d; }
    .story-card-action.saved i { color: var(--accent); }
  </style>
</head>

    /* ---- Confirm Dialog ---- */

        dialog.innerHTML = '<div class="confirm-overlay" onclick="event.target===this && document.getElementById(\'confirmDialog\').style.display=\'none\'">' +

          dialog.style.display = 'none';
          resolve(true);

    /* ---- Like / Save handlers for gallery cards ---- */
    async function handleStoryLike(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('liked');
      btn.classList.toggle('liked');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('liked') ? 'fas fa-heart' : 'far fa-heart';
      var countEl = btn.querySelector('.story-like-count');
      var n = parseInt(countEl.textContent) || 0;
      countEl.textContent = btn.classList.contains('liked') ? n + 1 : Math.max(0, n - 1);
      try {
        var nowLiked = await toggleLike(id);
        if (nowLiked && typeof createNotification === 'function') {
          try {
            var c = await fetchCreation(id);
            if (c && c.user_id) {
              var me = await getCurrentProfile();
              var myName = me ? (me.full_name || me.username) : 'Someone';
              await createNotification(c.user_id, 'like', id, null, myName + ' liked your creation');
            }
          } catch (e2) {}
        }
      } catch (e) {
        btn.classList.toggle('liked');
        iconEl.className = prev ? 'fas fa-heart' : 'far fa-heart';
        countEl.textContent = n;
      }
    }

    async function handleStorySave(id, btn) {
      var session = await getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      var prev = btn.classList.contains('saved');
      btn.classList.toggle('saved');
      var iconEl = btn.querySelector('i');
      iconEl.className = btn.classList.contains('saved') ? 'fas fa-bookmark' : 'far fa-bookmark';
      var labelEl = btn.querySelector('.story-save-label');
      if (labelEl) labelEl.textContent = btn.classList.contains('saved') ? 'Saved' : 'Save';
      try {
        await toggleSave(id);
        if (typeof syncSaveButton === 'function') {
          document.querySelectorAll('[data-save-for="' + id + '"]').forEach(function(o) { syncSaveButton(o, btn.classList.contains('saved')); });
        }
      } catch (e) {
        btn.classList.toggle('saved');
        iconEl.className = prev ? 'fas fa-bookmark' : 'far fa-bookmark';
        if (labelEl) labelEl.textContent = prev ? 'Saved' : 'Save';
      }
    }

    /* ---- Hydrate like/save state on visible cards (3 batched queries) ---- */
    async function hydrateStoryCards() {
      var cards = document.querySelectorAll('.story-card[data-creation-id]');
      if (!cards.length) return;

      var ids = [];
      for (var i = 0; i < cards.length; i++) ids.push(cards[i].getAttribute('data-creation-id'));

      // 1) Batch-fetch ALL like counts in ONE query
      try {
        var { data: likeRows, error: likeErr } = await supabaseClient
          .from('creation_likes')
          .select('creation_id')
          .in('creation_id', ids);
        if (!likeErr && likeRows) {
          var counts = {};
          likeRows.forEach(function(r) { counts[r.creation_id] = (counts[r.creation_id] || 0) + 1; });
          ids.forEach(function(id) {
            var btn = document.querySelector('.story-card[data-creation-id="' + id + '"] .story-card-action.like .story-like-count');
            if (btn) btn.textContent = counts[id] || 0;
          });
        }
      } catch (e1) { /* counts stay at 0 */ }

      // 2) Batch-fetch MY liked + saved state in TWO queries (requires session)
      var session = await getSession();
      if (!session || !session.user) return;

      var likedMap = {}, savedMap = {};
      try {
        likedMap = await getMyLikedCreationIds(ids) || {};
        savedMap = await getSavedCreationIds(ids) || {};
      } catch (e2) { return; }

      ids.forEach(function(id) {
        var card = document.querySelector('.story-card[data-creation-id="' + id + '"]');
        if (!card) return;
        if (likedMap[id]) {
          var lb = card.querySelector('.story-card-action.like');
          if (lb) { lb.classList.add('liked'); var li = lb.querySelector('i'); if (li) li.className = 'fas fa-heart'; }
        }
        if (savedMap[id]) {
          var sb = card.querySelector('.story-card-action.save');
          if (sb) {
            sb.classList.add('saved');
            var si = sb.querySelector('i');
            if (si) si.className = 'fas fa-bookmark';
            var sl = sb.querySelector('.story-save-label');
            if (sl) sl.textContent = 'Saved';
          }
        }
      });
    }

              '<button class="creation-action-btn"><i class="far fa-comment"></i> Comment</button>' +
              '<button class="creation-action-btn" onclick="var ic=this.querySelector(\'i\');var isSaved=this.classList.toggle(\'saved\');ic.className=isSaved?\'fas fa-bookmark\':\'far fa-bookmark\';this.querySelector(\'span\')?.textContent=isSaved?\'Saved\':\'Save\';"><i class="far fa-bookmark"></i> <span>Save</span></button>' +

          '</div>' +

            '<input type="file" id="fileInput" style="display:none" accept="image/jpeg,image/png,image/webp,image/gif">' +
            '<div class="form-group"><label>Title *</label><input type="text" id="uploadTitle" placeholder="Give your creation a name" maxlength="100"></div>' +
            '<div class="form-group"><label>Description *</label><textarea id="uploadDesc" placeholder="Describe your creation in detail..." maxlength="2000" rows="4"></textarea></div>' +
            '<div class="form-group"><label>Tags (comma separated)</label><input type="text" id="uploadTags" placeholder="anime, fusion, dragon ball" maxlength="200"></div>' +
          '</div>' +
          '<div class="upload-modal-footer">' +
            '<button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>' +
            '<button class="btn btn-primary" id="publishBtn" onclick="handlePublish()" disabled><i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish</button>' +
          '</div>' +
        '</div>' +
      '</div>';

      setupDropzone('dropzone', 'fileInput', 'mediaPreview');
    }

    function closeCreateModal() {
      document.getElementById('uploadModal').style.display = 'none';
      _uploadFile = null;
    }

    function setupDropzone(dzId, fiId, previewId) {
      var dz = document.getElementById(dzId);
      var fi = document.getElementById(fiId);
      if (!dz || !fi) return;
      dz.addEventListener('click', function() { fi.click(); });
      dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('dragover'); });
      dz.addEventListener('dragleave', function() { dz.classList.remove('dragover'); });
      dz.addEventListener('drop', function(e) { e.preventDefault(); dz.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFileSelect(e.dataTransfer.files[0]); });
      fi.addEventListener('change', function(e) { if (e.target.files[0]) handleFileSelect(e.target.files[0]); });
    }

    function handleFileSelect(file) {
      if (!VALID_IMAGE_TYPES.includes(file.type)) { showToast('Please select a JPG, PNG, GIF, or WEBP image.', 'error'); return; }
      if (file.size > MAX_IMAGE_SIZE) { showToast('Image must be less than 10MB.', 'error'); return; }
      _uploadFile = file;
      var preview = document.getElementById('mediaPreview');
      var dz = document.getElementById('dropzone');
      var reader = new FileReader();
      reader.onload = function(e) {
        preview.innerHTML = '<img src="' + e.target.result + '"><button class="upload-preview-remove" onclick="removeUploadFile()"><i class="fas fa-xmark"></i></button>';
        preview.classList.add('active');
        if (dz) dz.style.display = 'none';
        document.getElementById('publishBtn').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function removeUploadFile() {
      _uploadFile = null;
      var preview = document.getElementById('mediaPreview');
      preview.classList.remove('active');
      preview.innerHTML = '';
      var dz = document.getElementById('dropzone');
      if (dz) dz.style.display = '';
      document.getElementById('fileInput').value = '';
      document.getElementById('publishBtn').disabled = true;
    }

    async function handlePublish() {
      var btn = document.getElementById('publishBtn');
      if (!btn || btn.disabled || !_uploadFile) return;
      var title = (document.getElementById('uploadTitle') || {}).value || '';
      var desc = (document.getElementById('uploadDesc') || {}).value || '';
      var tagsStr = (document.getElementById('uploadTags') || {}).value || '';
      if (!title.trim()) { showToast('Please enter a title.', 'error'); return; }
      if (!desc.trim()) { showToast('Please add a description.', 'error'); return; }

      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });

      btn.disabled = true;
      btn.innerHTML = '<div class="loading-spinner" style="width:16px;height:16px;border-width:2px;"></div> Publishing...';
      document.getElementById('uploadProgress').classList.add('active');

      try {
        var result = await uploadCreationFile(_uploadFile, 'uploads', function(pct) {
          document.getElementById('uploadProgressBar').style.width = pct + '%';
          document.getElementById('uploadProgressText').textContent = pct < 100 ? 'Uploading... ' + pct + '%' : 'Processing...';
        });

        await createCreation({
          type: 'creator',
          title: title.trim(),
          description: desc.trim(),
          tags: tags,
          cover_image_url: result.url
        });

        closeCreateModal();
        showToast('Creation published!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to publish.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-paper-plane" style="margin-right:6px;"></i>Publish';
        document.getElementById('uploadProgress').classList.remove('active');
      }
    }

    /* ---- Edit Modal ---- */
    function openEditModal(id) {
      fetchCreation(id).then(function(c) {
        if (!c) return;
        var tagsStr = (c.tags || []).join(', ');
        var modal = document.getElementById('editModal');
        modal.style.display = 'block';
        modal.innerHTML = '<div class="upload-modal-overlay" onclick="if(event.target===this)closeEditModal()">' +
          '<div class="upload-modal" onclick="event.stopPropagation()">' +
            '<div class="upload-modal-header"><h3>Edit Creation</h3><button class="upload-modal-close" onclick="closeEditModal()"><i class="fas fa-xmark"></i></button></div>' +
            '<div class="upload-modal-body">' +
              '<div class="form-group"><label>Title *</label><input type="text" id="editTitle" value="' + postEscapeHtml(c.title) + '" maxlength="100"></div>' +
              '<div class="form-group"><label>Description *</label><textarea id="editDesc" rows="4" maxlength="2000">' + postEscapeHtml(c.description || '') + '</textarea></div>' +
              '<div class="form-group"><label>Tags (comma separated)</label><input type="text" id="editTags" value="' + postEscapeHtml(tagsStr) + '" maxlength="200"></div>' +
            '</div>' +
            '<div class="upload-modal-footer">' +
              '<button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>' +
              '<button class="btn btn-primary" id="saveEditBtn" onclick="handleSaveEdit(\'' + c.id + '\')"><i class="fas fa-check" style="margin-right:6px;"></i>Save</button>' +
            '</div>' +
          '</div>' +
        '</div>';
      });
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    async function handleSaveEdit(id) {
      var btn = document.getElementById('saveEditBtn');
      btn.disabled = true;
      var title = (document.getElementById('editTitle') || {}).value || '';
      var desc = (document.getElementById('editDesc') || {}).value || '';
      var tagsStr = (document.getElementById('editTags') || {}).value || '';
      if (!title.trim()) { showToast('Title is required.', 'error'); btn.disabled = false; return; }
      var tags = tagsStr.split(',').map(function(t) { return t.trim(); }).filter(function(t) { return t.length > 0; });
      try {
        await updateCreation(id, { title: title.trim(), description: desc.trim(), tags: tags });
        closeEditModal();
        showToast('Updated!', 'success');
        loadGallery();
      } catch (err) {
        showToast(err.message || 'Failed to update.', 'error');
        btn.disabled = false;
      }
    }

    /* ---- Delete ---- */
    async function handleDelete(id) {
      var confirmed = await showConfirm('Delete Creation', 'Are you sure you want to delete this? This action cannot be undone.');
      if (!confirmed) return;
      try {
        await deleteCreation(id);
        showToast('Deleted.', 'success');
        var card = document.querySelector('[data-creation-id="' + id + '"]');
        if (card) card.remove();
        checkEmpty();
      } catch (err) {
        showToast(err.message || 'Failed to delete.', 'error');
      }
    }

    function checkEmpty() {
      var gallery = document.getElementById('creatorGallery');
      var empty = document.getElementById('galleryEmpty');
      var cards = gallery.querySelectorAll('.story-card');
      if (cards.length === 0) empty.classList.add('active');
      else empty.classList.remove('active');
    }



    function renderSupabaseCard(c) {
      var profile = getDefaultUser(c) || c.profiles || {};
      var isOwner = currentUserId && c.user_id === currentUserId;
      var card = document.createElement('div');
      card.className = 'story-card' + (c.cover_image_url ? '' : ' no-cover');
      card.setAttribute('data-creation-id', c.id);
      var imgHtml = c.cover_image_url
        ? '<img class="story-card-img" src="' + resolveAssetUrl(c.cover_image_url) + '" loading="lazy" alt="' + postEscapeHtml(c.title) + '">'
        : '';
      card.onclick = function(e) {
        if (e.target.closest('.story-card-action') || e.target.closest('.creation-card-action-btn')) return;
        openCreatorDetail(c.id);
      };
      var ownerHtml = isOwner ? '<div class="story-card-owner">' +
        '<button class="creation-card-action-btn" onclick="event.stopPropagation();openEditModal(\'' + c.id + '\')"><i class="fas fa-pen"></i></button>' +
        '<button class="creation-card-action-btn delete" onclick="event.stopPropagation();handleDelete(\'' + c.id + '\')"><i class="fas fa-trash"></i></button>' +
      '</div>' : '';
      var userName = getCreationUserName(profile);
      var userAvatar = profile.avatar_url
        ? '<img src="' + profile.avatar_url + '" alt="">'
        : '<div style="width:20px;height:20px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;">' + userName.charAt(0).toUpperCase() + '</div>';
      card.innerHTML =
        imgHtml +
        '<div class="story-card-scrim"></div>' +
        '<div class="story-card-user">' + userAvatar + '<span>' + postEscapeHtml(userName) + '</span></div>' +
        ownerHtml +
        '<div class="story-card-title">' + postEscapeHtml(c.title) + '</div>' +
        '<div class="story-card-actions">' +
          '<button class="story-card-action like" onclick="event.stopPropagation();handleStoryLike(\'' + c.id + '\', this)"><i class="far fa-heart"></i> <span class="story-like-count">0</span></button>' +
          '<button class="story-card-action" onclick="event.stopPropagation();openCreatorDetail(\'' + c.id + '\')"><i class="far fa-comment"></i></button>' +
          '<button class="story-card-action share" onclick="event.stopPropagation();openShareSheet(\'' + c.id + '\')" aria-label="Share"><i class="fas fa-share-nodes"></i></button>' +
          '<button class="story-card-action save" data-save-for="' + c.id + '" onclick="event.stopPropagation();handleStorySave(\'' + c.id + '\', this)"><i class="far fa-bookmark"></i> <span class="story-save-label">Save</span></button>' +
        '</div>';
      return card;
    }

    /* ---- Ensure default images exist in database ---- */
    async function ensureDefaultCreations() {
      if (!supabaseClient) return {};
      var mapping = {};
      try {
        for (var i = 0; i < defaultCreations.length; i++) {
          var dc = defaultCreations[i];
          var desc = dc.points ? dc.points.map(function(p) { return '✦ ' + p.replace(/<[^>]*>/g, ''); }).join('\n') : '';
          // Check if already exists by title
          var { data: existing } = await supabaseClient
            .from('creations')
            .select('id')
            .eq('title', dc.title)
            .eq('type', 'creator')
            .maybeSingle();
          if (existing) {
            mapping[dc.id] = existing.id;
          } else {
            // Get a random user_id from an existing profile to assign
            var { data: profiles } = await supabaseClient
              .from('profiles')
              .select('id')
              .limit(1);
            var userId = profiles && profiles.length ? profiles[0].id : null;
            if (!userId) continue;
            var { data: inserted } = await supabaseClient
              .from('creations')
              .insert({
                user_id: userId,
                type: 'creator',
                title: dc.title,
                description: desc,
                cover_image_url: dc.cover_image_url
              })
              .select('id')
              .single();
            if (inserted) mapping[dc.id] = inserted.id;
          }
        }
      } catch(e) { console.error('[Creator] ensureDefault error:', e); }
      return mapping;
    }

    /* ---- Load Gallery ---- */
    async function loadGallery() {
      var container = document.getElementById('creatorGallery');
      var loading = document.getElementById('galleryLoading');
      loading.style.display = 'block';
      container.innerHTML = '';

      // Ensure defaults exist in database
      var idMapping = {};
      try { idMapping = await ensureDefaultCreations(); } catch(e) { console.error('[Creator] ensureDefault error:', e); }

      var creations = [];
      try { creations = await fetchCreations({ limit: 50, type: 'creator' }); } catch(e) { console.error('[Creator] fetch error:', e); }
      
      // Always hide loading
      loading.style.display = 'none';
      
      // If Supabase is not available or fetch failed, show defaults only
      if (!supabaseClient || !creations || creations.length === 0) {
        console.log('[Creator] Showing default cards only');
      }

      var randomUsers = [
        { name: 'AkiraSensei', initial: 'A', avatar: '../assets/images/avatars/anime-avatar-1.jpg' },
        { name: 'NarutoFan99', initial: 'N', avatar: '../assets/images/avatars/anime-avatar-2.jpg' },
        { name: 'SaiyanArtist', initial: 'S', avatar: '../assets/images/avatars/anime-avatar-3.jpg' },
        { name: 'LuffyLover', initial: 'L', avatar: '../assets/images/avatars/anime-avatar-4.jpg' },
        { name: 'IchigoInk', initial: 'I', avatar: '../assets/images/avatars/anime-avatar-5.jpg' },
        { name: 'ZoroDraws', initial: 'Z', avatar: '../assets/images/avatars/anime-avatar-6.jpg' },
        { name: 'Gear5Creator', initial: 'G', avatar: '../assets/images/avatars/avatar-1.jpg' },
        { name: 'AkatsukiArt', initial: 'A', avatar: '../assets/images/avatars/avatar-2.jpg' }
      ];
      var randomDates = ['2h ago', '5h ago', '1d ago', '3d ago', '5d ago', '1w ago', '2w ago', '1mo ago'];

      // Render default cards (with real IDs if available)
      defaultCreations.forEach(function(c, i) {
        var user = randomUsers[i % randomUsers.length];
        var realId = idMapping[c.id];
        var card = document.createElement('div');
        card.className = 'story-card';
        var actionsHtml = realId
          ? '<button class="story-card-action like" onclick="event.stopPropagation();handleStoryLike(\'' + realId + '\', this)"><i class="far fa-heart"></i> <span class="story-like-count">0</span></button>' +
            '<button class="story-card-action" onclick="event.stopPropagation();openCreatorDetail(\'' + realId + '\')"><i class="far fa-comment"></i></button>' +
            '<button class="story-card-action share" onclick="event.stopPropagation();openShareSheet(\'' + realId + '\')" aria-label="Share"><i class="fas fa-share-nodes"></i></button>' +
            '<button class="story-card-action save" data-save-for="' + realId + '" onclick="event.stopPropagation();handleStorySave(\'' + realId + '\', this)"><i class="far fa-bookmark"></i> <span class="story-save-label">Save</span></button>'
          : '';
        if (realId) {
          card.setAttribute('data-creation-id', realId);
          card.onclick = (function(rid, u) { return function(e) { if (e.target.closest('.story-card-action')) return; openCreatorDetail(rid, { username: u.name, full_name: u.name, avatar_url: u.avatar }); }; })(realId, user);
        } else {
          card.onclick = function(u, a, t) { return function() { openCreatorPopup(c.cover_image_url, c.title, c.points, u, a, t); }; }(user.name, user.avatar, randomDates[i % randomDates.length]);
        }
        card.innerHTML =
          '<img class="story-card-img" src="' + resolveAssetUrl(c.cover_image_url) + '" loading="lazy" alt="' + c.title + '">' +
          '<div class="story-card-scrim"></div>' +
          '<div class="story-card-user">' +
            '<img src="' + user.avatar + '" alt="' + user.name + '">' +
            '<span>' + user.name + '</span>' +
          '</div>' +
          '<div class="story-card-title">' + c.title + '</div>' +
          (actionsHtml ? '<div class="story-card-actions">' + actionsHtml + '</div>' : '');
        container.appendChild(card);
      });

      // Filter out defaults already rendered above
      var defaultTitles = defaultCreations.map(function(d) { return d.title; });
      creations.forEach(function(c) {
        if (defaultTitles.indexOf(c.title) === -1) container.appendChild(renderSupabaseCard(c));
      });

      checkEmpty();
      hydrateStoryCards();
    }
  </script>
